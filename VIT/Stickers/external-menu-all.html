<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Киоски · Стикеры — внешнее меню (один экран, экспандеры)</title>
<!--
  ЭКРАН «Внешнее меню · всё» — соединение двух экранов в ОДИН:
    • S5 «Внешнее меню · список» (external-menu.html?state=list) и
    • S6/S7 «Внешнее меню · таблица» (external-menu.html?state=base)
  Каждое внешнее меню — панель Expansion panel ДС (название + счётчик элементов);
  внутри панели — таблица элементов этого меню (версия = первая, как при переходе из списка).

  Компоненты ДС: Expansion panel (ds-expansion), Table (ds-table-*), Tabs, Search,
  Divider, Icon size, Text UI, Button (ссылка названия — Text/UI Link).
  Разметка и поведение — из существующих экранов (external-menu.html), новых компонентов нет.
-->
<script src="sidenav-menu.js"></script>
<script>window.DSR_NO_CHROME = true;</script>
<script src="../../../Design-System/connect.js" defer></script>
<script src="../../../Design-System/components-web/ds-patterns.js"></script>
<link rel="stylesheet" href="../../../Design-System/organisms/app-header-content/header-content.css?v=1">
<script src="../../../Design-System/organisms/app-header-content/header-content.js?v=1" defer></script>
<style>
  html, body { margin: 0; font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
  .apph__store, .apph__tabs, .apph__pill, .apph__cal, .apph__search, .apph__mpill, .apph__mright { display: none !important; }
  .material-icons { font-family: 'Material Icons Outlined'; }
  :root { color-scheme: light; }

  /* ── раскладка (вне ДС) ── */
  .frame { padding: var(--ds-space-5x, 20px) 30px var(--ds-space-6x, 24px); }
  @media (max-width: 1160px) { .frame { padding: var(--ds-space-5x, 20px) var(--ds-space-4x, 16px) var(--ds-space-6x, 24px); } }
  .page { display: flex; flex-direction: column; gap: var(--ds-space-4x, 16px); }
  /* вид экрана — как .vm-view на остальных экранах раздела: шапка → табы → контент, зазор 16 */
  #viewAll { display: flex; flex-direction: column; gap: var(--ds-space-4x, 16px); }
  .page [hidden] { display: none !important; }
  .sec-tabs { margin: 0; }

  /* поиск в шапке — механика организма header-content: Search XS раскрывается в поле Search S */
  #viewAll .hc__right { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); }
  .hc__search { cursor: pointer; }
  .hc__search.ds-search--xs { background: var(--ds-color-search-default-background-xs, #f0f5ff); border: 0; justify-content: center; }
  .hc__search.ds-search--xs:hover { background: var(--ds-color-search-hover-background-xs, #e8f0ff); border: 0; }
  .hc-search[hidden] { display: none; }
  .hc-search__input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font: inherit; color: var(--ds-color-search-focusvalue-text-color, #333333); }
  .hc-search__input::placeholder { color: var(--ds-color-search-focus-text-color, #d6d6d6); opacity: 1; }
  .hc-search:focus-within { border-color: var(--ds-color-search-focus-border-color, #448aff); }
  .hc-search .ds-search__right-icon { align-self: stretch; }
  .hc-search .ds-search__right-icon > .ds-divider { width: 1px; height: 100%; flex: 0 0 auto; }

  /* ── полоса фильтров — как на экране «Внешнее меню · таблица» ── */
  .tha { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-2x, 8px);
    box-sizing: border-box; min-height: 36px; padding: 4px 0; }
  /* как на экране «Внешнее меню · таблица»: от полосы до панелей — 8px */
  /* полоса фильтров — 4 поля в одну строку; на узкой ширине полоса переносится, а не вылезает */
  #allFilters { margin-bottom: calc(-1 * var(--ds-space-2x, 8px)); flex-wrap: wrap; row-gap: var(--ds-space-2x, 8px); }
  .vm-selects { flex-wrap: wrap; row-gap: var(--ds-space-2x, 8px); }
  .tha__left { display: flex; align-items: center; gap: var(--ds-space-4x, 16px); min-width: 0; }
  .tha__title { font-size: var(--ds-font-body-m-16-normal-medium-size, 16px); line-height: var(--ds-font-body-m-16-normal-medium-line, 24px);
    letter-spacing: var(--ds-font-body-m-16-normal-medium-spacing, 0); font-weight: var(--ds-font-body-m-16-normal-medium-weight, 500);
    color: var(--ds-color-text-primary, #333333); white-space: nowrap; }
  .vm-selects { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); min-width: 0; }
  .vm-selects .field-anchor { width: auto; }
  .vm-selects .ds-input--xs .ds-input__frame {
    border: 0;
    border-bottom: var(--ds-form-field-border-size, 1px) solid var(--ds-color-stroke-default, #e0e0e0);
    border-radius: var(--ds-radius-0);
    background: none;
  }
  .field-anchor { position: relative; display: block; min-width: 0; align-self: start; }
  .fsel { cursor: pointer; }
  .fsel .ds-input__field { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsel.is-open .ds-input__frame { border-bottom-color: var(--ds-color-form-field-filled-focus-border-color, #448aff); }
  .fpop { position: absolute; top: calc(100% + 2px); left: 0; z-index: 40; width: 100%; min-height: 0; }
  .fpop__wrap { display: flex; flex-direction: row; align-items: flex-start; width: 100%; min-height: 0; }
  .fpop__scroll { flex: 1 1 auto; min-width: 0; max-height: 320px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: var(--ds-space-2x, 8px); }
  .fpop__scroll::-webkit-scrollbar { display: none; }
  /* Divider внутри прокручиваемого списка: список — flex-колонка с overflow, и разделитель
     со flex-shrink:1 схлопывался в 0 px, когда пунктов больше max-height (не было видно линии) */
  .fpop__scroll > .ds-divider { flex: none; min-height: 1px; }
  .fpop .fscroll { flex: none; align-self: stretch; }
  .fpop__title { font-size: var(--ds-font-body-s-14-normal-regular-size); line-height: var(--ds-font-body-s-14-normal-regular-line);
    letter-spacing: var(--ds-font-body-s-14-normal-regular-spacing); font-weight: var(--ds-font-body-s-14-normal-medium-weight);
    color: var(--ds-color-text-primary, #333333); }
  .fpop .ds-select-item { width: 100%; cursor: pointer; align-items: flex-start; }
  .fpop .ds-select-item__content { flex: 1 1 auto; min-width: 0; }
  .fpop .ds-select-item__element-left,
  .fpop .ds-select-item__element-right { flex: none; align-self: center; }
  .fpop .ds-select-item__element-right { margin-left: auto; }

  /* ── экспандеры внешних меню ── */
  .vm-acc { display: flex; flex-direction: column; gap: var(--ds-space-2x, 8px); }
  .vm-acc .ds-expansion { width: 100%; }
  /* рамка панели: в fixes.css она сделана inset-тенью, а белые строки таблицы её закрывают —
     поэтому та же линия рисуется поверх контента (пробел ДС, как на экране «Внешнее меню · таблица») */
  .vm-acc .ds-expansion { position: relative; }
  .vm-acc .ds-expansion::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid var(--ds-color-stroke-default, #e0e0e0);
    border-radius: inherit;
    pointer-events: none;
  }
  .acc-title { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); min-width: 0; }
  .acc-name, .acc-count { font: inherit; color: inherit; }
  .acc-count { color: var(--ds-color-text-secondary, #616161); }

  /* ── таблица элементов внутри панели ── */
  .tbl { display: flex; flex-direction: column; overflow-x: auto; min-width: 0; }
  .tbl .ds-table-header-row, .tbl .ds-table-content-row { display: flex; flex-direction: row; align-items: stretch; width: 100%; min-width: 0; }
  .tbl .ds-table-content-cell { align-items: flex-start; }
  .t-c-dish { flex: 1 1 240px; min-width: 240px; }
  /* ховер ячейки — только у действенных: в колонке «Название для внеш. меню» ссылка на S8
     (слой ДС: фон Neutral/100 #EBEBEB; журнал ДС №176/№197) */
  .tbl .ds-table-content-row:not(.group-row) .ds-table-content-cell.t-c-dish:hover:not(:focus):not(:focus-within) { background: var(--ds-palette-neutral-100, #ebebeb); }
  .t-c-sys { flex: 1 1 180px; min-width: 180px; }
  /* «Артикул» — ширина по шапке: текст 57 + зазор 8 + иконка сортировки 20 + паддинги 16 = 101
     (было 96 — иконка сортировки налезала на паддинг, правило ширин таблиц) */
  .t-c-sku { width: 101px; flex: none; }
  .t-c-st { width: 204px; flex: none; }
  .t-c-dish .ds-text-ui, .t-c-sys .ds-text-ui, .t-c-sku .ds-text-ui { min-width: 0; width: 100%; }
  .t-c-dish .ds-text-ui__list-item, .t-c-sys .ds-text-ui__list-item { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* отступ текста первой колонки — как в «Баннерах» (v2, аккордеон): 28 px до текста, чтобы шапка,
     строки данных и название категории (36 px = паддинг 8 + шеврон 20 + зазор 8) стояли на одной линии */
  .tbl .t-c-dish .ds-text-ui__content { padding-left: 28px; }
  .vm-link { border: 0; background: none; padding: 0; text-align: left; font: var(--ds-font-body-s-14-normal-regular); color: var(--ds-color-text-ui-link-text-color, #448aff); cursor: pointer; }
  .tbl .ds-table-content-row:hover { background: var(--ds-color-table-row-content-hover-background, #f5f5f5); }

  /* ── строка-категория внутри панели (эталон — список баннеров):
     шеврон Icon size 5x поворачивается на 90°, название Body S medium, счётчик — Secondary ── */
  .tbl .ds-table-content-row.group-row { cursor: pointer; }
  .group-row .ds-table-content-cell__element { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); }
  .group-row .grp-arrow { display: inline-flex; color: var(--ds-color-icon-primary, #616161); transition: transform .15s ease; }
  .group-row.is-open .grp-arrow { transform: rotate(90deg); }
  .group-row .grp-name { font: var(--ds-font-caption-l-12-normal-medium); color: var(--ds-color-text-primary, #000000); }
  .group-row .grp-count { font: var(--ds-font-caption-l-12-normal-medium); color: var(--ds-color-text-secondary, #616161); }
  /* дополнительные показатели строки группировки — шрифтом подписи из списка баннеров
     (.grp-type / ds-text-ui__label-down: 12/16 regular, Text/Secondary #616161) */
  .cnt-extra { font: var(--ds-font-caption-l-12-normal-regular); color: var(--ds-color-text-secondary, #616161); }
  .acc-title .cnt-extra { font: var(--ds-font-caption-l-12-normal-regular); }
  .grp-count, .acc-count { display: inline-flex; align-items: baseline; gap: var(--ds-space-2x, 8px); }

  /* сортировка — как на стенде Table (№177) и на экране «Внешнее меню · таблица»:
     шапка кликабельна, стрелка Icon/Primary, у активной колонки — Accent, направление — поворотом */
  .ds-table-header-cell[data-sort] { cursor: pointer; }
  .ds-table-header-cell[data-sort] .ds-icon-size { color: var(--ds-color-icon-primary, #616161); }
  .ds-table-header-cell[data-sort] svg { position: relative; transition: transform .15s ease; }
  .ds-table-header-cell[data-dir="asc"] svg { transform: rotate(180deg); }
  .ds-table-header-cell.th-active .ds-text-ui__element-right .ds-icon-size { color: var(--ds-color-icon-accent, #448aff); }

  /* миниатюры стикеров — заглушки контента (как на остальных экранах) */
  .st-cell { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); flex-wrap: wrap; min-height: 28px; }
  /* миниатюра + бейдж-статус «на итоговой картинке комбо» в правом верхнем углу
     (Badge Positive 18×18, паддинг 1, radius circular — размеры компонента Counter; внутри Icon size 4x) */
  .st-thumb-wrap { position: relative; display: inline-flex; }
  .st-badge { position: absolute; top: calc(-1 * var(--ds-size-1x, 4px)); right: calc(-1 * var(--ds-size-1x, 4px));
    width: 18px; height: 18px; min-width: 18px; padding: var(--ds-size-0-25x, 1px); }
  .st-badge .ds-icon-size { color: var(--ds-color-text-inversive, #ffffff); }
  .st-thumb { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    min-width: 44px; height: 28px; padding: 0 var(--ds-space-2x, 8px);
    border-radius: var(--ds-radius-1-5x, 6px);
    background: var(--st-c, #e0e0e0); color: var(--st-t, #ffffff);
    font: var(--ds-font-caption-l-12-normal-medium); letter-spacing: var(--ds-font-caption-l-12-normal-medium-spacing);
    white-space: nowrap; }
  .st-thumb--icon { background: var(--ds-color-surface-default, #ffffff);
    border: 1px solid var(--ds-color-stroke-default, #e0e0e0); color: var(--ds-color-icon-secondary, #9e9e9e); }

  /* пустое состояние */
  .t-empty { display: flex; flex-direction: column; align-items: center; gap: var(--ds-space-2x, 8px);
    padding: var(--ds-space-8x, 32px) var(--ds-space-4x, 16px) var(--ds-space-10x, 40px); }
  .t-empty .ds-icon-size { color: var(--ds-color-icon-secondary, #9e9e9e); }
  .t-empty__title { font: var(--ds-font-body-m-16-normal-medium); color: var(--ds-color-text-primary, #333333); }
  .t-empty__text { font: var(--ds-font-body-s-14-normal-regular); color: var(--ds-color-text-secondary, #616161); text-align: center; }

  /* ══ S8: панель «Управление стикерами на элементе» — открывается ссылкой в названии ══ */
  .dlg-dim { position: fixed; inset: 0; z-index: 100; opacity: .15; }
  .dlg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 110;
    min-height: 0; max-width: calc(100vw - 32px); max-height: calc(100vh - 64px); overflow: hidden; }
  .dlg[hidden], .dlg-dim[hidden] { display: none !important; }
  .el-dlg { width: 1080px; max-width: calc(100vw - 32px); }
  .el-dlg .ds-dialog-header { position: relative; width: 100%; gap: var(--ds-dialog-header-gap, 8px);
    padding: var(--ds-dialog-header-pad-top, 24px) var(--ds-dialog-header-pad-right, 24px)
             var(--ds-dialog-header-pad-bottom, 8px) var(--ds-dialog-header-pad-left, 24px); }
  /* шапка: заголовок забирает свободное место, крестик — штатный слот Dialog header
     (ds-dialog-header__icon, Icon size 6x, Icon/Primary) */
  .el-dlg .ds-dialog-header__label { white-space: normal; flex: 1 0 0; min-width: 1px; }
  .el-dlg .ds-dialog-header__description { background: none; }
  .el-dlg .ds-dialog-header__icon { cursor: pointer; color: var(--ds-color-icon-primary, #616161); }
  .el-dlg .ds-dialog-view__footer { padding: 0; }
  .el-dlg .ds-dialog-view__action { height: auto; flex-direction: row; justify-content: flex-end; gap: var(--ds-space-2x, 8px);
    padding: var(--ds-dialog-footer-pad-top, 16px) var(--ds-dialog-footer-pad-right, 24px) var(--ds-dialog-footer-pad-bottom, 16px) var(--ds-dialog-footer-pad-left, 24px);
    border-top: 0; }
  /* Разделители шапки и подвала диалога — ОТ КРАЯ ДО КРАЯ диалога (замечание 06.11.2026: линия не доходила
     до краёв, т.к. висела на action, у которого боковые паддинги 24) и ТОЛЬКО когда контент прокручивается.
     Линия — inset-тень у контейнеров (у футера и шапки без боковых паддингов), геометрия не меняется */
  .el-dlg .ds-dialog-view__footer { box-shadow: inset 0 1px 0 var(--ds-color-stroke-default, #e0e0e0); }
  .el-dlg .ds-dialog-header { box-shadow: inset 0 -1px 0 var(--ds-color-stroke-default, #e0e0e0); }
  .el-dlg:not(.is-scroll) .ds-dialog-view__footer,
  .el-dlg:not(.is-scroll) .ds-dialog-header { box-shadow: none; }
  /* тело панели — слот Dialog content: контент + колонка Scroll справа (как в demo Dialog) */
  .el-dlg .ds-dialog-content { width: 100%; display: flex; flex-direction: row; align-items: stretch; min-height: 0; box-sizing: border-box; padding: 0; }
  /* контент: паддинги 8/24 компонента; СИСТЕМНУЮ полосу скрываем — по ДС скролл показывает компонент Scroll */
  .el-body { flex: 1 1 auto; min-width: 0; box-sizing: border-box;
    padding: var(--ds-space-2x, 8px) var(--ds-dialog-header-pad-right, 24px) 0 var(--ds-dialog-header-pad-left, 24px);
    max-height: calc(100vh - 64px - 120px); overflow-y: auto; scrollbar-width: none; }
  .el-body::-webkit-scrollbar { display: none; }
  /* колонка скролла — компонент Scroll (12); нет прокрутки — DSPatterns её скрывает */
  .el-dlg .el-scroll { flex: none; align-self: stretch; width: var(--ds-size-3x, 12px); box-sizing: border-box; }
  .el-sec { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: var(--ds-space-4x, 16px);
    padding-bottom: var(--ds-space-4x, 16px); }
  .el-sec + .el-sec { border-top: 1px solid var(--ds-color-stroke-default, #e0e0e0); padding-top: var(--ds-space-4x, 16px); }
  .el-sec__cap { font: var(--ds-font-body-s-14-normal-medium); color: var(--ds-color-text-primary, #333333);
    grid-column: 1 / -1; margin-bottom: var(--ds-space-2x, 8px); }
  .el-tbl { display: flex; flex-direction: column; }
  .el-tbl .ds-table-header-row, .el-tbl .ds-table-content-row { display: flex; flex-direction: row; align-items: stretch; width: 100%; }
  .el-tbl .ds-table-content-cell { align-items: flex-start; }
  .e-c-angle { flex: 1 1 220px; min-width: 220px; }
  .e-c-st { width: 280px; flex: none; }
  .e-c-combo { width: 129px; flex: none; position: relative; }
  .el-tbl .ds-table-content-cell.e-c-combo { align-items: center; justify-content: center; }
  .e-c-combo .ds-table-content-cell__element { width: 100%; display: flex; align-items: center; justify-content: center; }
  .e-c-combo .ds-slide-toggle { display: flex; align-items: center; }
  .e-c-combo .e-hint-ic { color: var(--ds-color-icon-primary, #616161); cursor: pointer; }
  .e-hint { position: fixed; z-index: 220; width: max-content; }
  .e-hint__arrow { display: block; flex-shrink: 0; width: 8px; height: 4px; fill: var(--ds-color-hint-background-color, #424242); }
  .e-hint__body { display: flex; flex-direction: column; width: 100%; min-width: 0;
    background: var(--ds-color-hint-background-color, #424242);
    border-radius: var(--ds-hint-border-radius, 8px); overflow: hidden; }
  .e-hint[hidden] { display: none !important; }
  .e-c-st .ds-table-content-cell__element { width: 100%; }
  .e-anchor { position: relative; display: block; width: 100%; }
  .e-c-st .fsel { width: 100%; background: transparent; }
  /* Состояния — ИЗ КОМПОНЕНТА Form-Field-Input_DS/input.css (ничего своего не добавляем):
     Hover  — фон #F5F5F5 + рамка #9E9E9E (`.ds-input__frame:hover`)
     Focus  — фон #F8F9FC + рамка #448AFF (`.ds-input__frame:focus-within`)
     Отличие только в покое: фон прозрачный (указание заказчика 06.11.2026 —
     селект в ячейке читается как текст, а не как поле ввода) */
  .e-c-st .fsel .ds-input__frame:not(:hover):not(:focus-within) { background: transparent; }
  /* открытый список — это состояние Focus компонента: те же фон и рамка */
  .e-c-st .fsel.is-open .ds-input__frame {
    background: var(--ds-color-shapes-default-variant, #f8f9fc);
    border-color: var(--ds-color-stroke-accent, #448aff);
  }
  /* стрелка поворачивается только у СЕБЯ (крестик очистки не трогаем) */
  .e-c-st .fsel.is-open .ds-input__icon .ds-icon-group__icon:last-child .material-icons { transform: rotate(180deg); }
  .e-anchor .fpop { width: 100%; }
  .e-anchor .fpop .fpop__scroll { max-height: 320px; }
  /* слой попапов вне диалога (portal): сам не ловит клики, попап — ловит */
  #elPopLayer { position: fixed; inset: 0; pointer-events: none; z-index: 240; }
  #elPopLayer .fpop { position: fixed; top: 0; left: 0; right: auto; bottom: auto; width: auto; pointer-events: auto; }
  .el-prev { display: flex; flex-direction: column; gap: var(--ds-space-2x, 8px); }
  .el-prev__box { position: relative; width: 200px; height: 200px; align-self: center; overflow: hidden;
    border: 1px solid var(--ds-color-stroke-default, #e0e0e0); border-radius: var(--ds-radius-2x, 8px);
    background: var(--ds-color-form-field-input-filled-background, #f8f9fc);

  .ds-table-content-row:not(.group-row):not([hidden]):not(:has(~ .ds-table-content-row:not([hidden]))) { border-bottom: 0; }

<div id="elPopLayer"></div>

<script>
(function () {
  'use strict';
  var qs = function (s, r) { return (r || document).querySelector(s); };
  var qsa = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  /* данные прототипа — тот же ключ, что на остальных экранах раздела */
  var KEY = 'vitStickersData';
  var raw = null;
  try { raw = sessionStorage.getItem(KEY); } catch (e) {}
  if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
  var data = null;
  if (raw) { try { data = JSON.parse(raw); } catch (e) {} }
  if (!data || !data.menus) { location.href = 'stickers.html'; return; }

  var placements = data.placements || [];
  var stickers = data.stickers || [];
  function stickerById(id) { return stickers.filter(function (s) { return s.id === id; })[0] || null; }
  function thumbHtml(id, combo) {
    var st = stickerById(id);
    var inner = st
      ? '<span class="st-thumb" style="--st-c:' + esc(st.color || '#e0e0e0') + ';--st-t:' + esc(st.textColor || '#ffffff') + '">' + esc(st.label || st.name || '') + '</span>'
      : '<span class="st-thumb st-thumb--icon"><span class="material-icons" aria-hidden="true">image</span></span>';
    if (!combo) return inner;
    /* бейдж-статус «Отображать на итоговой картинке комбо»: Badge Positive + Icon size 4x (check).
       В ДС бейджа с иконкой нет — пробел ДС №271 (собран из компонентов: Badge 18×18 + Icon size) */
    return '<span class="st-thumb-wrap">' + inner +
      '<span class="ds-badge ds-badge--counter ds-badge--positive st-badge" role="img" aria-label="Отображается на итоговой картинке комбо">' +
        '<span class="ds-icon-size ds-icon-size--4x"><span class="material-icons" aria-hidden="true">check</span></span>' +
      '</span></span>';
  }
  /* у стикера есть размещение с включённым тумблером «Отображать… комбо» */
  function comboOf(menuId, versionId, code, stickerId) {
    return placements.some(function (p) {
      return p.menu === menuId && p.version === versionId && p.code === code && p.sticker === stickerId && !!p.combo;
    });
  }
  /* стикеры элемента в версии (без дублей по размерам) — как колонка «Стикеры» на экране таблицы */
  function stickersOf(menuId, versionId, code) {
    var seen = {}, out = [];
    placements.forEach(function (p) {
      if (p.menu !== menuId || p.version !== versionId || p.code !== code) return;
      if (seen[p.sticker]) return;
      seen[p.sticker] = true;
      out.push(p.sticker);
    });
    return out;
  }
  /* фильтры полосы: внешнее меню / версия / тип элементов / наличие стикеров */
  var flt = { menu: 'all', version: '', types: { list: true, mod: true }, stickers: 'all' };
  /* сортировка таблицы элементов (D-03): пустой ключ = порядок из данных */
  var sortState = { key: '', dir: 'asc' };
  /* версия для панели: выбранная в фильтре (если есть у этого меню), иначе первая */
  function versionIdOf(menu) {
    var vs = menu.versions || [];
    if (flt.version) { for (var i = 0; i < vs.length; i++) if (vs[i].id === flt.version) return flt.version; }
    return (vs[0] || { id: 'base' }).id;
  }
  function itemsOf(menu) {
    var vid = versionIdOf(menu);
    var v = (menu.versions || []).filter(function (x) { return x.id === vid; })[0] || { id: vid, name: vid };
    var groups = data.catalog[menu.id + '|' + vid] || [];
    /* группы каталога (Соусы / Комбо / Блюда / Напитки) — сохраняем, чтобы показать их подзаголовками */
    return { version: v, groups: groups.map(function (g) { return { name: g.name, items: (g.items || []).slice() }; }) };
  }

  function rowHtml(menu, version, it, groupName, open) {
    var st = stickersOf(menu.id, version.id, it.code);
    var hasCombo = st.some(function (id) { return comboOf(menu.id, version.id, it.code, id); });
    var stHtml = st.length ? st.map(function (id) { return thumbHtml(id, comboOf(menu.id, version.id, it.code, id)); }).join('') : '<span class="ds-text-ui__list-item">—</span>';
    return '<div class="ds-table-content-row"' + (open ? '' : ' hidden') + ' data-row="' + esc(it.code) + '" data-type="' + esc(it.type || '') + '" data-has-st="' + (st.length ? '1' : '0') + '" data-combo="' + (hasCombo ? '1' : '0') + '"' + (groupName ? ' data-group-row="' + esc(groupName) + '"' : '') + '>' +
      '<div class="ds-table-content-cell t-c-dish"><div class="ds-table-content-cell__element"><div class="ds-element-cell ds-element-cell--text-ui"><div class="ds-text-ui"><div class="ds-text-ui__content"><button type="button" class="vm-link" data-open="' + esc(it.code) + '">' + esc(it.name) + '</button></div></div></div></div></div>' +
      '<div class="ds-table-content-cell t-c-sku"><div class="ds-table-content-cell__element"><div class="ds-element-cell ds-element-cell--text-ui"><div class="ds-text-ui"><div class="ds-text-ui__content"><span class="ds-text-ui__list-item">' + esc(it.code) + '</span></div></div></div></div></div>' +
      '<div class="ds-table-content-cell t-c-sys"><div class="ds-table-content-cell__element"><div class="ds-element-cell ds-element-cell--text-ui"><div class="ds-text-ui"><div class="ds-text-ui__content"><span class="ds-text-ui__list-item">' + esc(it.sys || '') + '</span></div></div></div></div></div>' +
      '<div class="ds-table-content-cell t-c-st"><div class="ds-table-content-cell__element"><div class="st-cell">' + stHtml + '</div></div></div>' +
    '</div>';
  }

  /* шапка колонки со стрелкой сортировки (D-03: сортировка по столбцам) — как на экране «Внешнее меню · таблица» */
  function hdrCell(label, key, cls) {
    var active = sortState.key === key;
    return '<div class="ds-table-header-cell ' + cls + (active ? ' th-active' : '') + '" data-sort="' + key + '"' + (active ? ' data-dir="' + sortState.dir + '"' : '') + '>' +
      '<div class="ds-element-cell ds-element-cell--text-ui"><div class="ds-text-ui"><div class="ds-text-ui__content"><span class="ds-text-ui__list-item">' + label + '</span></div>' +
      '<span class="ds-text-ui__element-right"><span class="ds-icon-size ds-icon-size--5x ds-icon-size--state th-sort"><svg width="20" height="20" aria-hidden="true"><use href="#i-sort"/></svg></span></span></div></div></div>';
  }

  /* счётчики: в строке категории — только количество; «Стикер N» и «Отображено N» — только в заголовке меню */
  function countsHtml(total, st, on, isGroup) {
    if (isGroup) return '<span class="cnt-total">' + total + '</span>';
    return '<span class="cnt-total">' + total + '</span>' +
      '<span class="cnt-extra">Стикер ' + st + '</span>' +
      (on > 0 ? '<span class="cnt-extra">Отображено ' + on + '</span>' : '');
  }
  function paintCounts(el, total, st, on, isGroup) {
    if (el) el.innerHTML = countsHtml(total, st, on, isGroup);
  }

  function panelHtml(menu) {
    var info = itemsOf(menu);
    var total = 0;
    var body = '';
    info.groups.forEach(function (g) {
      /* сортировка по колонкам — внутри каждой категории */
      var items = g.items;
      if (sortState.key) {
        items = items.slice().sort(function (a, b) {
          var av = sortState.key === 'name' ? a.name : (sortState.key === 'sys' ? (a.sys || '') : a.code);
          var bv = sortState.key === 'name' ? b.name : (sortState.key === 'sys' ? (b.sys || '') : b.code);
          var r = String(av).localeCompare(String(bv), 'ru', { numeric: true, sensitivity: 'base' });
          return sortState.dir === 'asc' ? r : -r;
        });
      }
      total += items.length;
      var gkey = menu.id + '|' + g.name;
      var open = openedGroups.hasOwnProperty(gkey) ? openedGroups[gkey] : true;
      /* строка-заголовок категории (эталон — список баннеров): шеврон + название + счётчик */
      body += '<div class="ds-table-content-row group-row' + (open ? ' is-open' : '') + '" data-group="' + esc(g.name) + '" role="button" tabindex="0" aria-expanded="' + (open ? 'true' : 'false') + '">' +
          '<div class="ds-table-content-cell t-c-dish"><div class="ds-table-content-cell__element">' +
            '<span class="grp-arrow"><span class="ds-icon-size ds-icon-size--5x"><span class="material-icons" aria-hidden="true">chevron_right</span></span></span>' +
            '<span class="grp-name">' + esc(g.name) + '</span>' +
            '<span class="grp-count">' + countsHtml(items.length, items.filter(function (it) { return stickersOf(menu.id, info.version.id, it.code).length > 0; }).length, items.filter(function (it) { var ids = stickersOf(menu.id, info.version.id, it.code); return ids.some(function (id) { return comboOf(menu.id, info.version.id, it.code, id); }); }).length, true) + '</span>' +
          '</div></div>' +
          '<div class="ds-table-content-cell t-c-sku"></div>' +
          '<div class="ds-table-content-cell t-c-sys"></div>' +
          '<div class="ds-table-content-cell t-c-st"></div>' +
        '</div>';
      body += items.map(function (it) { return rowHtml(menu, info.version, it, g.name, open); }).join('');
    });
    return '<div class="ds-expansion" data-menu="' + esc(menu.id) + '">' +
      '<div class="ds-expansion__header" role="button" tabindex="0" aria-expanded="false">' +
        '<span class="ds-expansion__arrow"><span class="material-icons" aria-hidden="true">keyboard_arrow_down</span></span>' +
        '<span class="ds-expansion__title"><span class="acc-title"><span class="acc-name">' + esc(menu.name) + '</span><span class="acc-count">' + countsHtml(total, 0, 0) + '</span></span></span>' +
      '</div>' +
      '<div class="ds-expansion__content ds-expansion__content--no-padding">' +
        '<div class="tbl">' +
          '<div class="ds-table-header-row">' +
            hdrCell('Название для внеш. меню', 'name', 't-c-dish') +

              '<span class="ds-slide-toggle__track"></span>' +
            '</span></label>' +
          '</div></div>' +
        '</div>';
      }).join('');
      sec.innerHTML = (sz ? '<div class="el-sec__cap">Размер: ' + esc(sz) + '</div>' : '') +
        '<div class="el-tbl"><div class="ds-table-header-row">' +
          '<div class="ds-table-header-cell e-c-angle"><div class="ds-element-cell ds-element-cell--text-ui"><div class="ds-text-ui"><div class="ds-text-ui__content"><span class="ds-text-ui__list-item">Расположение стикера</span></div></div></div></div>' +
          '<div class="ds-table-header-cell e-c-st"><div class="ds-element-cell ds-element-cell--text-ui"><div class="ds-text-ui"><div class="ds-text-ui__content"><span class="ds-text-ui__list-item">Стикер</span></div></div></div></div>' +
          '<div class="ds-table-header-cell e-c-combo">' +
            '<div class="ds-element-cell ds-element-cell--text-ui"><div class="ds-text-ui">' +
              '<div class="ds-text-ui__content"><span class="ds-text-ui__list-item">Отображать</span></div>' +
              '<span class="ds-text-ui__element-right"><span class="ds-icon-size ds-icon-size--5x ds-icon-size--state e-hint-ic" role="button" tabindex="0" aria-label="Отображать на итоговой картинке комбо"><span class="material-icons" aria-hidden="true">info</span></span></span>' +
            '</div></div>' +
          '</div>' +
        '</div>' + rowsHtml + '</div>' + preview;
      elBody.appendChild(sec);
    });
    syncDlgScroll();
  }

  /* разделители шапки/подвала диалога — по факту прокрутки тела (скролла нет — линии нет) */
  function syncDlgScroll() {
    var can = elBody.scrollHeight > elBody.clientHeight + 1;
    elDlg.classList.toggle('is-scroll', can);
    /* полоса — компонентом Scroll (сама прячется, если прокрутки нет) */
    if (window.DSPatterns && DSPatterns.scrollSync) DSPatterns.scrollSync(elBody, elScroll);
  }
  window.addEventListener('resize', function () { if (elState) syncDlgScroll(); });
  /* панель ревью/окно меняют размер кадра без события resize — следим за самим телом */
  if (window.ResizeObserver) new ResizeObserver(function () { if (elState) syncDlgScroll(); }).observe(elBody);

  /* список стикеров в поле — пункты ДС (--false + --selected) */
  function buildElPop(pop, anchor, sz, angle) {
    var host = pop.querySelector('.fpop__scroll');
    host.innerHTML = '';
    var cur = elState.rows[sz].filter(function (r) { return r.angle === angle; })[0].sticker;
    data.stickers.forEach(function (st) {
      var item = document.createElement('div');
      item.className = 'ds-select-item ds-select-item--false' + (cur === st.id ? ' ds-select-item--selected' : '');
      item.innerHTML = '<div class="ds-select-item__content"><span class="ds-select-item__label"></span></div>' +
        '<span class="ds-select-item__element-right"' + (cur === st.id ? '' : ' hidden') + '><span class="ds-icon-size ds-icon-size--5x"><span class="material-icons" aria-hidden="true">check</span></span></span>';
      item.querySelector('.ds-select-item__label').textContent = st.name;
      item.addEventListener('click', function () {
        var row = elState.rows[sz].filter(function (r) { return r.angle === angle; })[0];
        row.sticker = st.id;
        closeElPop();
        renderElementPanel();
      });
      host.appendChild(item);
    });
  }

  /* подсказка к иконке «info» — компонент Hint, один элемент на страницу (position: fixed) */
  function showElHint(target, on) {
    var ic = target.closest ? target.closest('.e-hint-ic') : null;
    var hint = qs('#elHint');
    if (!ic || !hint) return;
    hint.hidden = !on;
    if (!on) return;
    var r = ic.getBoundingClientRect();
    hint.style.left = '0px';
    /* тултип не перекрывает шапку таблицы: ниже её нижней границы (но не ближе 8 к иконке) */
    var row = ic.closest('.ds-table-header-row');
    var top = r.bottom + 8;
    if (row) top = Math.max(top, row.getBoundingClientRect().bottom + 4);
    hint.style.top = Math.round(top) + 'px';
    var hr = hint.getBoundingClientRect();
    /* центрируем по иконке — хвостик указывает точно на неё; у края экрана — зажим,
       а хвостик доворачиваем, чтобы он остался под иконкой */
    var cx = r.left + r.width / 2;
    var left = Math.max(8, Math.min(window.innerWidth - hr.width - 8, Math.round(cx - hr.width / 2)));
    hint.style.left = left + 'px';
    var arrow = hint.querySelector('.e-hint__arrow');
    if (arrow) {
      var aw = arrow.getBoundingClientRect().width || 8;
      var shift = Math.round(cx - (left + hr.width / 2));
      var maxShift = Math.round(hr.width / 2 - aw / 2 - 4);
      shift = Math.max(-maxShift, Math.min(maxShift, shift));
      arrow.style.transform = shift ? 'translateX(' + shift + 'px)' : '';
    }
  }

  elBody.addEventListener('click', function (e) {
    /* клик по полю селекта не должен доходить до document — иначе попап закроется тем же кликом */
    if (e.target.closest('.e-anchor')) e.stopPropagation();
    var clr = e.target.closest('[data-el-clear]');
    if (clr) {
      var key = clr.getAttribute('data-el-clear').split('|');
      var sz = key[0] === '' ? null : key[0];
      var row = elState.rows[sz].filter(function (r) { return r.angle === key[1]; })[0];
      row.sticker = '';
      row.combo = false;
      closeElPop();
      renderElementPanel();
      return;
    }
    var anchor = e.target.closest('.e-anchor');
    if (!anchor) return;
    var pop = anchor.querySelector('.fpop');
    if (!pop) return;
    if (elPop === pop && !pop.hidden) { closeElPop(); return; }
    closeElPop();
    var k = anchor.getAttribute('data-anchor').split('|');
    var szA = k[0] === '' ? null : k[0];
    var angleA = k[1];
    /* попап — во вьюпорте (portal, fixed): измеряем полную высоту, потом решаем вниз/вверх
       и сколько места отдать списку: элементов немного — попап виден целиком */
    var ar = anchor.getBoundingClientRect();
    var GAP = 2, EDGE = 8;
    elPopLayer.appendChild(pop);
    pop.style.width = Math.round(ar.width) + 'px';
    pop.style.left = Math.round(ar.left) + 'px';
    pop.style.top = Math.round(ar.bottom + GAP) + 'px';
    pop.classList.remove('is-up');
    pop.hidden = false;
    elPop = pop;
    elPopAnchor = anchor;
    buildElPop(pop, anchor, szA, angleA);
    var list = pop.querySelector('.fpop__scroll');
    if (list) {
      list.style.maxHeight = '';
      var natural = pop.offsetHeight;
      var chrome = Math.max(0, natural - list.offsetHeight);
      var below = window.innerHeight - EDGE - (ar.bottom + GAP);
      var above = ar.top - GAP - EDGE;
      var goUp = natural > below && above > below;
      pop.classList.toggle('is-up', goUp);
      var avail = (goUp ? above : below) - chrome;
      list.style.maxHeight = Math.max(44, Math.min(320, avail, list.scrollHeight)) + 'px';
      var h = pop.offsetHeight;
      pop.style.top = Math.round(goUp ? Math.max(EDGE, ar.top - GAP - h) : ar.bottom + GAP) + 'px';
      if (window.DSPatterns) DSPatterns.scrollSync(list, pop.querySelector('.fscroll'));
    }
    anchor.querySelector('.fsel').classList.add('is-open');
  });
  /* прокрутка тела/страницы — попап перестаёт «прилипать» к полю: закрываем (как тултип) */
  elBody.addEventListener('scroll', function () { closeElPop(); });
  document.addEventListener('click', function (e) {
    if (elPop && !elPop.contains(e.target)) closeElPop();
  });
  elBody.addEventListener('change', function (e) {
    var tg = e.target.closest && e.target.closest('[data-el-toggle]');
    if (!tg) return;
    var key = tg.getAttribute('data-el-toggle').split('|');
    var sz = key[0] === '' ? null : key[0];
    var row = elState.rows[sz].filter(function (r) { return r.angle === key[1]; })[0];
    row.combo = tg.checked;
  });
  elBody.addEventListener('mouseover', function (e) { if (e.target.closest && e.target.closest('.e-hint-ic')) showElHint(e.target, true); });
  elBody.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('.e-hint-ic')) showElHint(e.target, false); });
  elBody.addEventListener('focusin', function (e) { if (e.target.closest && e.target.closest('.e-hint-ic')) showElHint(e.target, true); });
  elBody.addEventListener('focusout', function (e) { if (e.target.closest && e.target.closest('.e-hint-ic')) showElHint(e.target, false); });
  elBody.addEventListener('scroll', function () { var h = qs('#elHint'); if (h) h.hidden = true; });

  qs('#elClose').addEventListener('click', closeElementPanel);
  qs('#elCancel').addEventListener('click', closeElementPanel);
  elDim.addEventListener('click', closeElementPanel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (elPop) { closeElPop(); return; }
      if (!elDlg.hidden) closeElementPanel();
    }
  });
  qs('#elSave').addEventListener('click', function () {
    if (!elState) return;
    /* заменяем привязки элемента в выбранной версии (D-07: «Сохранить»); другие элементы не трогаем */
    data.placements = placements.filter(function (p) {
      return !(p.menu === elState.menu && p.version === elState.version && p.code === elState.code);
    });
    Object.keys(elState.rows).forEach(function (szKey) {
      var sz = szKey === 'null' ? null : szKey;
      elState.rows[szKey].forEach(function (r) {
        if (!r.sticker) return;
        data.placements.push({ sticker: r.sticker, menu: elState.menu, version: elState.version, code: elState.code, size: sz, angle: r.angle, combo: r.combo });
      });
    });
    placements = data.placements;
    try { sessionStorage.setItem(KEY, JSON.stringify(data)); } catch (err) {}
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (err) {}
    closeElementPanel();
    renderAll();
  });

  /* табы раздела */
  qsa('[data-go]').forEach(function (b) { b.addEventListener('click', function () { location.href = b.getAttribute('data-go'); }); });
})();
</script>
</body>
</html>
