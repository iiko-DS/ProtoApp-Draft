      if (!visible.length) return '<div class="kds-snone">Ничего не найдено</div>';
      var buckets = {}, order = [];
      visible.forEach(function (e) {
        var c = slCat(e.it);
        if (!buckets[c]) { buckets[c] = []; order.push(c); }
        buckets[c].push(e);
      });
      order.sort(function (a, b) { return String(a || '').localeCompare(String(b || ''), 'ru'); });
      return order.map(function (c) {
        /* Поиск раскрывает категории с совпадениями — иначе найденная строка

                '<span class="kds-sgroup__t">' + esc(c) + '</span>' +

    /* Запись в стоп-лист прямо из правой панели: позиция появляется в левом списке */
    function slPanePut(src, szName, v) {
      var items = slData();
      var tgt = null;
      for (var k = 0; k < items.length; k++) if (items[k].name === src.name) { tgt = items[k]; break; }
      if (szName != null) {
        if (!tgt) { tgt = { name: src.name, unit: src.unit || 'шт', sizes: [] }; items.push(tgt); }
        if (!tgt.sizes) tgt.sizes = [];
        /* Полный размерный ряд блюда держим рядом (sizesAll) — по нему видно, внесены ли ВСЕ
           размеры. Без этого частичное внесение (25 и 30 из 25/30/35) не отличалось от полного,
           и в списке появлялась одна строка с подписью «Все размеры» */
        if (!tgt.sizesAll && src.sizes && src.sizes.length) {
          tgt.sizesAll = src.sizes.map(function (s) { return s.s; });
        }
        var sz = null;
        for (var j = 0; j < tgt.sizes.length; j++) if (tgt.sizes[j].s === szName) { sz = tgt.sizes[j]; break; }
        if (!sz) { sz = { s: szName }; tgt.sizes.push(sz); }
        if (v && v.stop) { sz.stop = true; sz.rest = ''; }
        else { sz.stop = false; sz.rest = v.rest; }
        /* Пустой экран — демо-копия списка: первая позиция должна попасть и в живой список.
           Если живого списка ещё нет — начинаем его с нуля, без демо-набора.
           __live включаем с этого момента: с этого экрана живой список ведёт его же демо-копия,
           и снятие ограничения должно убирать позицию из живого списка, а не оставлять
           строку панели недоступной */
        if (RT.cfg && RT.cfg.emptyDemo) { if (SLITEMS == null) SLITEMS = []; RT.cfg.__live = true; slLivePutSize(src, szName, v); }
        return;
      }
      if (!tgt) { tgt = { name: src.name, unit: src.unit || 'шт' }; items.push(tgt); }
      if (v && v.stop) { tgt.stop = true; tgt.rest = ''; }
      else { tgt.stop = false; tgt.rest = v.rest; }
      if (RT.cfg && RT.cfg.emptyDemo) { if (SLITEMS == null) SLITEMS = []; RT.cfg.__live = true; slLivePutDish(src, v); }
    }
    /* Строка блюда с размерами — одно значение на все размеры, как в панели
       внесения. store=false — живой ввод в панели цифр (только показываем),
       store=true — сохранение значения (пишем и в RT.sl.pane.vals) */
    function slPaneGroupToSizes(inp, store) {
      var pane = RT.sl && RT.sl.pane;
      if (!pane || !pane.items || !RT.view) return;
      var i = +inp.getAttribute('data-sl-in');
      var it = pane.items[i];
      if (!it || !it.sizes || !it.sizes.length) return;
      var v = String(inp.value == null ? '' : inp.value);
      if (store) pane.vals = pane.vals || {};
      it.sizes.forEach(function (sz, si) {
        var sk = i + ':' + si;
        if (store) pane.vals[sk] = v;
        var el = RT.view.querySelector('[data-sl-pane-key="' + sk + '"]');
        if (el) el.value = v;
      });
    }
    /* Обратный ход: поменяли один размер — сводная строка показывает общее значение,
       а если значения разошлись — «разные» (как поле-группа на других экранах) */
    function slPaneSizesToGroup(i, store) {
      var pane = RT.sl && RT.sl.pane;

      if (!it || !it.sizes || it.sizes.length < 2) return;
      var vals = it.sizes.map(function (sz, si) {
        var el = RT.view.querySelector('[data-sl-pane-key="' + i + ':' + si + '"]');
        return el ? String(el.value == null ? '' : el.value) : '';
      });
      var same = vals.every(function (v) { return v === vals[0]; });

    function slScrollSync() {
      if (!RT.view) return;

      var strip = RT.view.querySelector('.kds-sbody-scroll');

      strip.hidden = !can;

      var knob = strip.querySelector('.ds-scroll__knob');

    function toggleSlCheck(key) {

    function parseRest(v) {

      var n = parseFloat(s.replace(',', '.'));
      if (isNaN(n) || n < 0) return { ok: false };
      if (n !== 0 && (n < 0.001 || n > 999.999)) return { ok: false };

      var plans = [];

      } else if (it.sizes && it.sizes.length) {

      } else {

      }
      /* Блюдо с размерами вносим целиком: сначала применяем общее поле (если его трогали) */
      var whole = si == null && it.sizes && it.sizes.length > 0;
      if (whole && !slApplyGroup(i)) return;

      var added = [], bad = false;

          : RT.view.querySelector('[data-sl-in="' + i + '"]');

        if (!pr.ok) { if (inp) slRowErr(inp, true); bad = true; return; }

        added.push((!pr.empty && pr.val > 0) ? { rest: fmtRest(pr.val) } : { stop: true });

      if (whole) {

      } else if (si != null && it.sizes && it.sizes[si]) {

      /* Панель категории, куда добавили позицию, должна быть развёрнута в стоп-листе */
      var catAdded = slCat(it);

      /* Строка НЕ уходит из списка внесения: позиция остаётся на месте и становится
         недоступной — состояние считается по живому стоп-листу при отрисовке.

      RT.sl.added = (RT.sl.added || 0) + 1;

    function slMass(k) {
      var items = slData();
      var checked = slChecked().map(Number);

    /* ── Рендер блоков ── */
    function qtyBox(qty, cls, bg) {
      if (!(qty > 1)) return '';
      return '<span class="' + (cls || 'kds-qty') + '"' + (bg ? ' style="background:' + bg + '"' : '') + '>' + qty + '</span>';

    function starIcon() { return '<span class="kds-star">' + svgIco('stars', 16) + '</span>'; }
    /* Строка блюда: статус — цвет/иконка кнопки (как в макете) */
    function dishRow(dd) {
      var st = dd.st || 'waiting';
      var neg = st === 'cancelled';
      var nocook = st === 'nocook';
      var ico = RT.asm ? icoFor(st, 'asm') : (neg ? 'close' : (st === 'ready' ? 'check' : 'arrow_forward'));
      var guest = dd.guest
        ? '<div class="kds-guest">' + esc(dd.guest) + (dd.star ? '<span style="margin-left:auto">' + starIcon() + '</span>' : '') + '</div>'
        : '';
      /* Принадлежность к набору — отдельной строкой НАД названием («Ланч №N»), 12/16 #9E9E9E, без иконки */
      var combo = dd.combo
        ? '<div class="kds-row__combo-line" data-full="' + esc(dd.combo + (dd.inst && dd.many ? ' №' + dd.inst : '')) + '">' + esc(dd.combo) + (dd.inst && dd.many ? ' №' + dd.inst : '') + '</div>'
        : '';
      /* Вторичная подпись: только служебный текст («не готовится» для позиции сборщика) */
      var sub = '';
      if (dd.sub) {
        sub = '<div class="kds-row__sub">' + esc(dd.sub) + '</div>';
      } else if (nocook) {
        sub = '<div class="kds-row__nocook"><span class="material-icons">no_food</span>не готовится — берёт сборщик</div>';
      }
      /* Модификаторы блюда — строкой под названием, как служебная подпись; элемент может быть
         объектом {t, neg} — тогда модификатор отменён и рисуется красным.
         modCmt — только g-two-combos: модификатор оформляется как комментарий */
      var mods = (dd.mods && dd.mods.length)
        ? '<div class="kds-row__mods' + (dd.modCmt ? ' kds-row__mods--cmt' : '') + '">' +
            (dd.modCmt ? '<div class="kds-row__mods-cmt"><span class="material-icons">mode_comment</span><div class="kds-row__mods-in">' : '') +
            dd.mods.map(function (x) {
              var t = typeof x === 'string' ? x : x.t;
              var neg = typeof x !== 'string' && x.neg;
              var del = typeof x !== 'string' && x.del;
              return '<div class="kds-row__mod' + (neg ? ' kds-row__mod--neg' : '') + (del ? ' kds-row__mod--del' : '') + '">' + esc(t) + '</div>';
            }).join('') +
            (dd.modCmt ? '</div></div>' : '') +
          '</div>'
        : '';
      /* Длинное название обрезаем и раскрываем полное по нажатию на всю строку (тач, не hover) */
      var long = dd.name.length > 26;
      var full = long ? ' data-full="' + esc(dd.name) + '"' : '';
      var rid = dd._rid ? ' data-rid="' + dd._rid + '"' : '';
      var instRow = dd.instKey ? ' data-inst-row="' + esc(dd.instKey) + '"' : '';
      var ktc = dd.kt ? ' kds-row--kt-' + dd.kt : '';
      /* Экран сборщика: у блюд нет кнопок — только иконка статуса (не кнопка);
         позиция без приготовления (напиток сборщика) — без статуса вовсе */
      var ctl = nocook
        ? ''
        : RT.asm
          ? '<span class="kds-row__ico kds-btn--' + st + '"><span class="material-icons">' + ico + '</span></span>'
          : st === 'cancelled'
            ? '<span class="kds-row__ico kds-row__ico--x"><span class="material-icons">close</span></span>'
            : '<button class="kds-btn kds-btn--' + st + '" type="button"><span class="material-icons">' + ico + '</span></button>';
      return '<div class="kds-row kds-row--' + st + (neg ? ' kds-row--neg' : '') + (dd.sel ? ' kds-row--sel' : '') + ktc + '"' + rid + instRow + '>' +
        '<div class="kds-row__main"' + full + '>' + guest + combo +
          '<div class="kds-row__line">' + qtyBox(dd.qty, null, dd.qtyBg) + '<span class="kds-row__name' + (long ? ' kds-ellip' : '') + '">' + esc(dd.name) + '</span></div>' +
          mods +
          sub +
        '</div>' +
        ctl +
      '</div>';
    }
    /* Подпись «N из M блюд» — сколько блюд экземпляра видно на карточке из общего числа.
       Элемент живёт в DOM всегда (при N ≥ M — скрыт): фильтр скрывает строки уже после отрисовки,
       и тогда applyFilter пересчитывает N и показывает подпись. */
    function seenCapHtml(g, cls) {
      var n = g._seenN != null ? g._seenN : (g.rows || []).filter(function (r) { return (r.st || 'waiting') !== 'cancelled'; }).length;
      var m = g._seenM != null ? g._seenM : (g.total || 0);
      if (!m || n <= 0) return '';
      var hidden = n >= m ? ' style="display:none"' : '';
      return '<div class="' + cls + '"' + hidden + ' data-seen="' + esc(g._instKey || '') + '" data-seen-m="' + m + '" title="на экране ' + n + ' из ' + m + ' блюд набора">' +
        '<span data-seen-l1>' + n + ' из ' + m + ' блюд</span></div>';
    }
    /* Блок блюда с модификаторами: шапка (гость + название), компоненты, комментарий, одна кнопка на всю высоту */
    function setBlock(o) {
      var g = o.g;
      var st = g.st || 'waiting';
      var gline = (g.guest || g.star)
        ? '<div class="kds-kit__gline">' + (g.guest ? '<span class="kds-guest">' + esc(g.guest) + '</span>' : '') +
          (g.star ? '<span class="kds-kit__star">' + starIcon() + '</span>' : '') + '</div>'
        : '';
      var cmText = Array.isArray(g.comment) ? g.comment[1] : g.comment;   // данные бывают в старом формате [иконка, текст]
      var comment = cmText
        ? '<div class="kds-kit__comment"><div class="kds-kit__comment-in"><span class="material-icons">mode_comment</span><span class="kds-comment__text">' + esc(cmText) + '</span></div></div>'
        : '';
      var name = o.name;
      var long = name.length > 26;
      var headFull = long ? ' data-full="' + esc(name) + '"' : '';
      return '<div class="kds-kit kds-kit--' + st + (g.neg ? ' kds-kit--neg' : '') + (o.tall ? ' kds-kit--tall' : '') + (o.mods ? ' kds-kit--mods' : '') + '"' + (g._rid ? ' data-rid="' + g._rid + '"' : '') + '>' +
        '<div class="kds-kit__body">' +
          '<div class="kds-kit__head"' + headFull + '>' + gline +
            '<div class="kds-kit__nrow"><div class="kds-kit__name' + (long ? ' kds-ellip' : '') + '">' + esc(name) + '</div>' +
            seenCapHtml(g, 'kds-kit__seen') + '</div></div>' +
          (o.kids || '') + comment +
        '</div>' +
        '<button class="kds-kit__btn kds-kit__btn--' + st + '" type="button"><span class="material-icons">' + icoFor(st, 'mgroup') + '</span></button>' +
      '</div>';
    }
    /* Блюдо с модификаторами (Figma 10585:7793) — только для базы: заголовок блюда и модификаторы
       текстом без своих кнопок. Это НЕ набор: у блюда законны одна кнопка на всю высоту,
       количество у модификаторов и комментарий; для группы набора используется cset. */
    function dishModsGroup(g) {
      /* Отменён последний видимый компонент — пустой группы не остаётся */
      if ((g.rows || []).length && g.rows.every(function (rr) { return (rr.st || 'waiting') === 'cancelled'; })) return '';
      var kids = (g.rows || []).map(function (rr) {
        var st = rr.st || 'waiting';
        var neg = rr.neg || st === 'cancelled';
        return '<div class="kds-kit__comp' + (neg ? ' kds-kit__comp--neg' : '') + (st === 'cancelled' ? ' kds-kit__comp--cancelled' : '') + '"' + (rr._rid ? ' data-rid="' + rr._rid + '"' : '') + '>' +
          (rr.qty > 1 ? '<span class="kds-kit__qty' + (neg ? ' kds-kit__qty--neg' : '') + '">' + rr.qty + '</span>' : '') +
          '<span>' + esc(rr.name || rr.text) + '</span></div>';
      }).join('');
      return setBlock({ g: g, name: g.title || g.name, kids: kids });
    }
    /* Группа набора по сценариям: заголовок без кнопки/количества/статуса,
       компоненты — вложенные строки (отступ 24) со своими кнопками и статусами */
    function csetGroup(g) {
      var rows = g.rows || [];
      /* Отменён последний видимый компонент — заголовок не висит без строк.
         Пример «комбо целиком» (allNeg) — наоборот, группу показываем всю отменённой */
      if (!g.allNeg && rows.length && rows.every(function (rr) { return (rr.st || 'waiting') === 'cancelled'; })) return '';
      var gline = g.guest
        ? '<div class="kds-cset__gline"><span class="kds-guest">' + esc(g.guest) + '</span></div>'
        : '';
      var title = g.title || g.name;
      var long = title.length > 26;
      var headFull = long ? ' data-full="' + esc(title) + '"' : '';
      var kids = rows.map(function (rr) {
        var h = dishRow({ _rid: rr._rid, name: rr.name || rr.text, qty: rr.qty, st: rr.st || 'waiting', kt: rr.kt, instKey: g._instKey, mods: rr.mods, modCmt: rr.modCmt });
        /* Отдельно готовящийся модификатор, вложенный под родительским блюдом (g-modifier, сценарий 3.6) */
        if (rr.subMod) {
          var m = rr.subMod;
          m._chip = m.chip;
          h += '<div class="kds-cset__submod">' + modRow(m) + '</div>';
        }
        return h;
      }).join('');
      /* Модификаторы уровня набора (g-modifier): идут вместе после блюд, блоком с отступом в один уровень;
         если блюд в группе нет (g-modifier-sep, карточка 2) — на уровне строк блюд, как у «Ланч 1» */
      if (g.mods && g.mods.length) {
        var modsHtml = g.mods.map(function (m) { m._chip = m.chip; return modRow(m); }).join('');
        kids += (rows && rows.length) ? '<div class="kds-cset__submod">' + modsHtml + '</div>' : modsHtml;
      }
      /* Примерка (экран 10, вариант «гость справа»): если подписи видимости нет (набор полный),
         гость занимает правый слот шапки, а отдельная строка гостя не выводится */
      var cap = g.capText
        ? '<div class="kds-cset__seen" data-seen-static="1"><span data-seen-l1>' + esc(g.capText) + '</span></div>'
        : seenCapHtml(g, 'kds-cset__seen');
      if (g._guestRight && !cap && g.guest) {
        cap = '<span class="kds-cset__guest-right">' + esc(g.guest) + '</span>';
        gline = '';
      }
      var nameRow = '<div class="kds-cset__row"><div class="kds-cset__name"><span class="kds-cset__ico"' + (g._icoColor ? ' style="color:' + g._icoColor + '"' : '') + '>' + svgIco('fastfood', 20) + '</span>' +
          '<span class="kds-cset__t' + (long ? ' kds-ellip' : '') + '">' + esc(title) + '</span>' +
          (g._chip ? '<span class="kds-cset__inst"' + (g._chipColor ? ' style="background:' + g._chipColor + '"' : '') + '>' + esc(g._chip) + '</span>' : '') + '</div>' +
          cap + '</div>';
      var headCls = 'kds-cset__head' + (g.headTall ? ' kds-cset__head--tall' : '') + (g._guestRight && !gline ? ' kds-cset__head--tight' : '');
      /* Вторая строка шапки (например «Модификаторы») — как строка гостя, но под названием: отступ на ширину иконки + зазор */
      var lbl = g.subLabel ? '<div class="kds-cset__gline kds-cset__gline--sub"><span class="kds-guest">' + esc(g.subLabel) + '</span></div>' : '';
      return '<div class="kds-cset' + (g.allNeg ? ' kds-cset--neg' : '') + ((g._nameStyle || (RT.cfg && RT.cfg.nameStyle)) ? ' kds-cset--' + (g._nameStyle || RT.cfg.nameStyle) : '') + '"' + (g._rid ? ' data-rid="' + g._rid + '"' : '') + '>' +
        '<div class="' + headCls + '"' + headFull + '>' + gline + nameRow + lbl + '</div>' +
        '<div class="kds-cset__rows">' + kids + '</div></div>';
    }
    /* Группа макета: та же «коробка», но строки-модификаторы с количеством */
    function mgroup(g) {
      var kids = (g.rows || []).map(function (rr) {
        var negc = (rr.neg || g.neg) ? ' kds-kit__comp--neg' : '';
        var plain = (!g.flush && !(rr.qty > 1)) ? ' kds-kit__comp--plain' : '';
        var tight = g.flush ? ' kds-kit__comp--tight' : '';
        var tallc = rr.tall ? ' kds-kit__comp--tall' : '';
        var qty = rr.qty > 1
          ? '<span class="kds-kit__qty' + (rr.neg ? ' kds-kit__qty--neg' : '') + '">' + rr.qty + '</span>'
          : '';
        return '<div class="kds-kit__comp' + plain + negc + tight + tallc + '">' + qty + '<span>' + esc(rr.text) + '</span></div>';
      }).join('');
      if (!g.st) g.st = g.neg ? 'cancelled' : (g.btn === 'check' ? 'ready' : 'waiting');
      return setBlock({ g: g, name: g.name, kids: kids, tall: g.tall, mods: true });
    }
    /* Группа макета: блюдо с вложенными блюдами (отступ 24), у каждой строки своя кнопка */
    function nestGroup(g) {
      var head = dishRow({ _rid: g._rid, guest: g.guest, qty: g.qty, name: g.name, st: g.st || 'waiting' });
      var subs = g.rows.map(function (rr) {
        return dishRow({ _rid: rr._rid, name: rr.name, qty: rr.qty || 1, st: rr.st || 'waiting' });
      }).join('');
      return '<div class="kds-nest">' + head + '<div class="kds-nest__rows">' + subs + '</div></div>';
    }
    /* Отдельно готовящийся модификатор: строка блюда + обе связи ТЕКСТОМ. Пиктограмма для этого
       смысла не утверждена — пока иконки нет (кандидат post_add показан только на постере) */
    function modRow(m) {
      /* связь с набором: если в заказе несколько его экземпляров — с номером экземпляра.
         noLink — мод вложен в набор под блюдом: связь с экземпляром видна вложенностью.
         st cancelled — удалённый мод: красный, зачёркнутый, справа крестик */
      var neg = m.st === 'cancelled';
      var link = esc(m.combo) + (m._chip && m.inst ? ' ' + m.inst : '');
      var linkPart = m.noLink ? '' : '<span class="kds-dsep">·</span><span class="kds-dlink">' + link + '</span>';
      var ctl = neg
        ? '<span class="kds-row__ico kds-row__ico--x"><span class="material-icons">close</span></span>'
        : '<button class="kds-btn kds-btn--' + (m.st || 'waiting') + '" type="button"><span class="material-icons">' + icoFor(m.st || 'waiting', 'mod') + '</span></button>';
      var sub = m.noSub ? '' : '<div class="kds-drow__sub"><span class="kds-ditem">к ' + esc(m.parent) + '</span>' + linkPart + '</div>';
      return '<div class="kds-row kds-row--mod' + (neg ? ' kds-row--neg kds-row--cancelled' : '') + '"' + (m._rid ? ' data-rid="' + m._rid + '"' : '') + '>' +
        '<div class="kds-row__main">' +
          '<div class="kds-row__line"><span class="kds-row__name">' + esc(m.name) + '</span></div>' +
          sub +
        '</div>' +
        ctl +

    /* Сброс живого списка из текущего рендера (только экран стоп-листа) */

      /* Кадр КДС заданной ширины/высоты. Мобильный кадр (<= 480) получает класс --mob */

    /* Переход внутри прототипа (кнопкой) не меняет URL, и панель ревью продолжала показывать старый

    function syncReviewPanel(id) {

    /* ── Холст: кадр всегда 1:1, без масштабирования — чтобы в инспекторе и на экране

    /* ── Тултип полного названия (своя раскладка: Hint для тёмной темы КДС в ДС нет) ── */
    function relPos(el, root) {

    function bindTips(view) {

      function hide() { clearTimeout(hideT); tip.style.display = 'none'; tip.textContent = ''; }

    /* ── Прокрутка «рукой»: мышью тянем доску/список, на тач-экране — нативный свайп ── */
    function bindPan(view) {
      if (!view) return;

    /* ── Полоса скролла под лентой (своя, как в макете: 12 px, ползунок 8 px #333) ── */
    function bindScrollStrip(view) {
      if (!view) return;
      var board = view.querySelector('.kds-board');
      var strip = view.querySelector('.kds-scrollstrip');
      var thumb = view.querySelector('.kds-scrollstrip__thumb');
      if (!strip || !thumb) return;
      if (!board) { strip.style.display = 'none'; return; }
      function upd() {
        var cw = board.clientWidth, sw = board.scrollWidth;
        /* Полоса видна всегда, как в макете: при переполнении ползунок — доля,
           без переполнения — во всю ширину трека */
        strip.style.display = 'block';
        var track = cw - 4;
        var w = Math.min(track, Math.max(48, Math.round(track * cw / sw)));

    /* ── Вертикальная полоса скролла режима «по блюдам» (Figma Scroll: трек #9E9E9E, ползунок #616161) ── */
    function bindVScroll(view) {
      var list = view.querySelector('.kds-dlist');

        var k = Math.max(24, Math.round(th * ch / sh));

        knob.style.transform = 'translateY(' + Math.round((list.scrollTop / (sh - ch)) * (th - k)) + 'px)';

      window.addEventListener('resize', upd);

    function rowAction(rid) {

    /* на экране 6 карточек, а в макете 12/2/8 — храним дельту, чтобы стартовые
       цифры совпадали с Figma, а дальше реагировали на нажатия */
    function displayCounts() {
      var c = countsNow();
      /* цифры в шапке — реальные количества блюд (без подмешивания Figma-значений) */
      return { run: c.run, over: c.over, done: c.done, avg: CNT_BASE.avg };
    }
    function applyCounts() {
      if (!RT.view) return;
      var c = displayCounts();
      ['run', 'over', 'done', 'avg'].forEach(function (k) {
        var el = RT.view.querySelector('[data-cnt="' + k + '"]');
        if (el) el.textContent = c[k];
      });
      var menu = RT.view.querySelector('.kds-menu--metrics');
      if (menu) {
        var rows = menu.querySelectorAll('[data-mrow]');
        Array.prototype.forEach.call(rows, function (r) {
          var k = r.getAttribute('data-mrow');
          r.lastChild.textContent = r.getAttribute('data-label') + ' ' + c[k];
        });
      }
      applyFilter();
    }
    /* ── Счётчики-фильтры: «В работе» / «Просрочено» / «Вовремя» ── */
    function toggleFilter(k) {
      RT.filter = RT.filter === k ? null : k;
      applyFilter();
      /* фильтр применяется к ленте с её начала — иначе скрытые карточки за экраном
         и кажется, что фильтр ничего не сделал */
      var board = RT.view && RT.view.querySelector('.kds-board');
      if (board) board.scrollLeft = 0;
    }
    function matchFilter(st, overdue) {
      if (!RT.filter) return true;
      return inBucket(RT.filter, st, overdue);
    }
    function applyFilter() {
      if (!RT.view || !RT.cfg) return;
      var changed = false;
      /* Фильтр — по ЗАДАЧАМ (блюдам), как счётчики шапки: неподходящие блюда скрываются
         внутри карточек, карточка без единого видимого блюда прячется целиком */
      (RT.cfg.orders || []).forEach(function (o) {
        var art = cardEl(o._cid);
        if (!art) return;
        var overdue = !!(o.timerNeg || (o._secs != null && o._secs < 0));
        var any = false;
        Array.prototype.forEach.call(art.querySelectorAll('[data-rid]'), function (el) {
          var m = RT.M[el.getAttribute('data-rid')];
          if (!m) return;
          /* контейнер группы не блюдо: его видимость решается по его блюдам (ниже) */
          if ((el.classList.contains('kds-kit') || el.classList.contains('kds-cset')) && el.querySelector('[data-rid]')) return;
          var st = m.o.st || 'waiting';
          var hide = (st === 'done') || !matchFilter(st, overdue);
          var want = hide ? 'none' : '';
          if (el.style.display !== want) { el.style.display = want; changed = true; }
          if (!hide) any = true;
        });
        /* контейнер группы виден, только если внутри есть видимое блюдо */
        Array.prototype.forEach.call(art.querySelectorAll('.kds-kit[data-rid], .kds-cset[data-rid]'), function (box) {
          var kids = box.querySelectorAll('[data-rid]');
          if (!kids.length) return;
          var alive = Array.prototype.some.call(kids, function (k) { return k.style.display !== 'none'; });
          var wantBox = alive ? '' : 'none';
          if (box.style.display !== wantBox) { box.style.display = wantBox; changed = true; }
        });
        /* подпись видимости — по видимым строкам ЭТОГО блока на карточке */
        Array.prototype.forEach.call(art.querySelectorAll('[data-seen]'), function (cap) {
          if (cap.hasAttribute('data-seen-static')) return;   /* подпись задана в данных — не пересчитываем */
          var m = +cap.getAttribute('data-seen-m') || 0;
          var n = 0;
          var box = cap.closest('.kds-cset, .kds-kit');
          if (box) Array.prototype.forEach.call(box.querySelectorAll('.kds-row, .kds-kit__comp'), function (r) {
            if (r.style.display === 'none') return;
            if (r.classList.contains('kds-row--mod')) return;       /* модификатор — не блюдо набора */
            if (r.closest('.kds-cset__submod')) return;  /* вложенный мод — не блюдо набора */
            if (r.classList.contains('kds-row--cancelled') || r.classList.contains('kds-kit__comp--cancelled')) return;  /* отменённое не считаем */
            n++;
          });
          var l1 = cap.querySelector('[data-seen-l1]');
          if (l1) l1.textContent = n + ' из ' + m + ' блюд';
          cap.title = 'на экране ' + n + ' из ' + m + ' блюд набора';
          var wantCap = n > 0 && n < m ? '' : 'none';
          if (cap.style.display !== wantCap) { cap.style.display = wantCap; changed = true; }
        });
        var want = (o._hidden || (!!RT.filter && !any)) ? 'none' : '';
        if (art.style.display !== want) { art.style.display = want; changed = true; }
      });
      (RT.cfg.rows || []).forEach(function (rw) {
        var d = rw.dish || rw;
        if (!d._rid) return;
        var el = rowEl(d._rid);
        if (!el) return;
        var want = (d.st === 'done' || !matchFilter(d.st || 'waiting', !!rw.timerNeg)) ? 'none' : '';   // сброшенное блюдо не возвращаем фильтром
        if (el.style.display !== want) { el.style.display = want; changed = true; }
      });
      Array.prototype.forEach.call(RT.view.querySelectorAll('[data-filter]'), function (b) {
        b.classList.toggle('is-sel', RT.filter === b.getAttribute('data-filter'));
      });
      if (changed) {
        var board = RT.view.querySelector('.kds-board');
        if (board) board.dispatchEvent(new Event('scroll'));
      }
    }
    function syncUndo() {

    /* ── Выпадающие панели шапки (Figma: Menu setting, Menu header + content) ── */
    function openPop(anchor, cls, html) {
      var wasOpen = RT.pop && RT.pop.anchor === anchor;
      closePop();
      if (wasOpen) return null;
      var menu = document.createElement('div');
      menu.className = 'kds-menu ' + cls + ' is-open';
      menu.innerHTML = html;
      var layer = RT.layer || RT.view;
      layer.appendChild(menu);
      var p = relPos(anchor, layer);
      var w = menu.offsetWidth, h = menu.offsetHeight;
      var left = Math.min(Math.max(8, p.x), Math.max(8, layer.clientWidth - w - 8));
      var top = p.y + anchor.offsetHeight + 8;
      if (top + h > layer.clientHeight - 8) top = Math.max(8, p.y - h - 8);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      RT.pop = { el: menu, anchor: anchor };
      return menu;
    }
    function closePop() {
      if (!RT.view) return;
      Array.prototype.forEach.call(RT.view.querySelectorAll('.kds-menu:not(.kds-sconfirm)'), function (m) { m.remove(); });
      Array.prototype.forEach.call(RT.view.querySelectorAll('[data-select].is-open'), function (b) { b.classList.remove('is-open'); });
      RT.pop = null;
    }

    /* панель «Настройки»: шапка с заголовком и ×, «Тема», «Масштаб» */
    function openSettings(anchor) {

              '<button class="kds-toggle__i' + (RT.opts.theme === 'dark' ? ' is-on' : '') + '" type="button" data-act="theme-dark"><span class="material-icons">dark_mode</span></button>' +

    /* списки терминала и ресторана — тот же контейнер меню */
    function openSelect(btn) {

    /* ── Тема и масштаб (панель «Настройки» из Figma) ── */
    function setTheme(t) {
      RT.opts.theme = t;
      applyTheme();
      var l = RT.view.querySelector('[data-act="theme-light"]');
      var d = RT.view.querySelector('[data-act="theme-dark"]');
      if (l) l.classList.toggle('is-on', t === 'light');
      if (d) d.classList.toggle('is-on', t === 'dark');
    }
    function applyTheme() {
      if (RT.view) RT.view.classList.toggle('kds-view--light', RT.opts.theme === 'light');
    }
    function setZoom(z) {
      RT.opts.zoom = Math.min(1.5, Math.max(0.6, Math.round(z * 100) / 100));
      applyZoom();
    }
    function applyZoom() {
      if (!RT.view) return;
      var z = RT.opts.zoom;
      if (RT.layer) {
        RT.layer.style.transform = 'scale(' + z + ')';
        RT.layer.style.width = (100 / z) + '%';
        RT.layer.style.height = (100 / z) + '%';
      }
      var v = RT.view.querySelector('[data-zoomval]');
      if (v) v.textContent = Math.round(z * 100) + '%';
    }
    /* питание — состояние смены, которое показывает футер («Включен»/«Выключен») */
    function toggleShift() {
      RT.shift = !RT.shift;
      if (!RT.view) return;
      var st = RT.view.querySelector('.kds-footer__status');
      if (st) st.innerHTML = '<span class="kds-dot"></span>' + (RT.shift ? 'Включен' : 'Выключен');
      var dot = st && st.querySelector('.kds-dot');
      if (dot) dot.style.background = RT.shift ? '' : 'var(--kds-ic-neutral)';
      var area = RT.view.querySelector('.kds-board, .kds-dlist, .kds-posters, .kds-slist');
      if (area) area.style.opacity = RT.shift ? '' : '.45';
    }
    function doAct(a) {
      if (a === 'power') toggleShift();
      else if (a === 'undo') undo();
      else if (a === 'close-pop') closePop();
      else if (a === 'theme-light') setTheme('light');
      else if (a === 'theme-dark') setTheme('dark');
      else if (a === 'zoom-in') setZoom(RT.opts.zoom + 0.1);
      else if (a === 'zoom-out') setZoom(RT.opts.zoom - 0.1);
      else if (a === 'zoom-reset') setZoom(1);
    }

    /* ── Живые таймеры карточек и часы в шапке ── */
    function startTicker() {
      clearInterval(RT.tickId);
      RT.tickId = setInterval(function () {
        if (!RT.view || document.hidden) return;
        var clock = RT.view.querySelector('[data-clock]');
        /* Часы в шапке — HH:MM: пишем только когда минута сменилась.
           Иначе каждую секунду — запись в DOM, за ней MutationObserver и полный
           проход по документу ради иконок (лишняя работа в фоне) */
        if (clock) {
          var hhmm = nowHHMM();
          if (clock.textContent !== hhmm) clock.textContent = hhmm;
        }
        var list = RT.cfg && RT.cfg.orders;
        if (!list || !RT.shift) return;
        var moved = false;
        list.forEach(function (o) {
          if (o._secs == null || o._hidden || o.st === 'ready' || o.st === 'cancelled') return;
          o._secs -= 1; moved = true;
          var art = RT.view.querySelector('[data-cid="' + o._cid + '"]');
          if (art) {
            var t = art.querySelector('.kds-card__timer');
            if (t) t.textContent = fmtTimer(o._secs);
            /* просрочка — это только красный таймер и подсветка полосы, статус задачи не меняется
               (в макете карточка «Готовится» спокойно живёт с отрицательным таймером) */
            var head = art.querySelector('.kds-card__head');
            if (head && o._secs < 0) head.style.setProperty('--st-timer', '#ff5252');
          }
        });
        if (moved) applyCounts();
      }, 1000);
    }

    /* ── Ползунок полосы скролла: тянется мышью и пальцем ── */
    function bindThumb(view) {
      var board = view.querySelector('.kds-board');
      var thumb = view.querySelector('.kds-scrollstrip__thumb');
      if (!board || !thumb) return;
      var dragging = false, startX = 0, startL = 0, k = 1;
      thumb.addEventListener('pointerdown', function (e) {
        dragging = true; startX = e.clientX; startL = board.scrollLeft;
        k = view.getBoundingClientRect().width / view.offsetWidth || 1;
        try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault(); e.stopPropagation();
      });
      thumb.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var cw = board.clientWidth, sw = board.scrollWidth;
        var max = Math.max(1, (cw - 4) - thumb.offsetWidth);
        board.scrollLeft = startL + ((e.clientX - startX) / k / max) * (sw - cw);
        e.stopPropagation();
      });
      function end() { dragging = false; }
      thumb.addEventListener('pointerup', end);
      thumb.addEventListener('pointercancel', end);
    }

    /* ── Один делегированный обработчик на весь экран ── */
    /* ── Один делегированный обработчик на весь экран ── */
    function bindInteractive(view) {
      if (!view) return;
      view.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (RT.sl) {
          var confEl = view.querySelector('[data-sl-confirm]');
          if (confEl && confEl.classList.contains('is-open')) {
            var cfBtn = t.closest('[data-sl-confirm="yes"], [data-sl-confirm="no"]');
            if (cfBtn) { slConfirm(cfBtn.getAttribute('data-sl-confirm')); return; }
            if (!t.closest('[data-sl-confirm]')) closeSlConfirm();
            return;
          }
          var cf = t.closest('[data-sl-confirm]');
          if (cf) { slConfirm(cf.getAttribute('data-sl-confirm')); return; }
          /* Тап мимо открытого попапа — закрыть и НЕ выполнять то, по чему попали */
          if (RT.pop && RT.pop.el && !t.closest('.kds-menu')) { closePop(); return; }
          /* Цифровая панель: клавиши пишут в поле, тап мимо панели и поля — закрыть */
          var kbK = t.closest('[data-sl-kb]');
          if (kbK) { e.preventDefault(); slKbdKey(kbK.getAttribute('data-sl-kb')); return; }
          var padK = t.closest('[data-sl-k]');
          if (padK) { e.preventDefault(); slPadKey(padK.getAttribute('data-sl-k')); return; }
          /* Выбор размера прямо в панели */
          var padSizeBtn = t.closest('[data-sl-pad-size]');
          if (padSizeBtn) { e.preventDefault(); slPadPick(padSizeBtn.getAttribute('data-sl-pad-size')); return; }
          /* Тап по любому месту поля остатка (внутренние отступы, единица «шт»/«порц») —
             это тап по полю: фокусируем input, и панель ввода открывается тем же focusin */
          if (RT.cfg && RT.cfg.split) {
            var padFrame = t.closest('.kds-srow__val .ds-input__frame');
            if (padFrame && !t.closest('input') && !t.closest('button')) {
              var padField = padFrame.querySelector('[data-sl-in]');
              if (padField && !padField.disabled) {
                e.preventDefault();
                /* Поле уже в фокусе (панель закрыли, фокус остался) — перезапускаем focusin,
                   иначе повторный тап не откроет панель */
                if (document.activeElement === padField) padField.blur();
                padField.focus(); return;
              }
            }
            /* Тап по самой строке блюда (плашка с названием) — тоже открывает панель ввода:
               попадать пальцем в поле не нужно. У внесённых строк поля нет — там ничего не делаем */
            var paneRowEl = t.closest('[data-sl-pane-row]');
            if (paneRowEl && !t.closest('input') && !t.closest('button')) {
              var paneField = paneRowEl.querySelector('[data-sl-in]');
              if (paneField && !paneField.disabled) {
                e.preventDefault();
                if (document.activeElement === paneField) paneField.blur();
                paneField.focus(); return;
              }
            }
          }
          if (!t.closest('.kds-numpad') && !t.closest('[data-sl-in]')) {
            /* Панель всплывает ровно под пальцем: событие click после открытия приходит уже
               на панель (mousedown был на поле) — такой клик её не закрывает */
            if (!RT.sl.padShownAt || Date.now() - RT.sl.padShownAt > 250) {
              if (RT.cfg && RT.cfg.flatSizes && RT.sl.padDirty && RT.sl.padDish != null) {
                /* Набранное значение применяем так же, как по «Закрыть»; невалидное — откат */
                if (slPadValidate()) slPadApply(); else slPadRevert();
              } else if (!slPadValidate()) {
                slPadRevert();
              } else {
                slPadHide();
              }
            }
          }
          if (!t.closest('[data-sl-kbd]') && !t.closest('.kds-ssearch')) slKbdHide();
          var back = t.closest('[data-sl-back]');
          if (back) { render(back.getAttribute('data-sl-back')); return; }
          var addb = t.closest('[data-sl-add]');
          if (addb) { render('split'); return; }
          /* Внесение из правой панели и сворачивание её категорий */
          var paneAddBtn = t.closest('[data-sl-paneadd]');
          if (paneAddBtn) { e.preventDefault(); slPaneAdd(paneAddBtn.getAttribute('data-sl-paneadd')); return; }
          var paneFoldBtn = t.closest('[data-sl-panefold]');
          if (paneFoldBtn) {
            e.preventDefault();
            var pfCat = paneFoldBtn.getAttribute('data-sl-panefold');
            var pfGrp = paneFoldBtn.closest('.kds-sgrp');
            var pfOff = !(pfGrp && pfGrp.classList.contains('is-collapsed'));
            RT.sl.pane.folds = RT.sl.pane.folds || {};
            RT.sl.pane.folds[pfCat] = pfOff;
            if (pfGrp) pfGrp.classList.toggle('is-collapsed', pfOff);
            paneFoldBtn.setAttribute('aria-expanded', pfOff ? 'false' : 'true');
            var pfIco = paneFoldBtn.querySelector('.kds-sgroup__ico');
            if (pfIco) slMi(pfIco, pfOff ? 'chevron_right' : 'expand_more');
            return;
          }
          /* Вариант «своя кнопка в строке»: одна строка вносится сразу, экран остаётся */
          var rowAddBtn = t.closest('[data-sl-rowadd]');
          if (rowAddBtn) { e.preventDefault(); slAddRow(rowAddBtn); return; }
          var arw = t.closest('[data-sl-addrow]');
          if (arw) {
            var arRow = arw.closest('[data-sl-row]');
            var arInp = arRow && arRow.querySelector('[data-sl-in]');
            if (arInp && !slCommit(arInp)) arInp.focus();
            return;
          }
          /* Кнопки шага у поля: шаг на 1 и сразу сохраняем */
          var stepBtn = t.closest('[data-sl-step]');
          if (stepBtn) {
            e.preventDefault();
            var stepWrap = stepBtn.closest('.kds-srow__val');
            var stepInp = stepWrap && stepWrap.querySelector('[data-sl-in]');
            if (stepInp) slStep(stepInp, +stepBtn.getAttribute('data-sl-step'));
            return;
          }
          /* Сброс значения в поле (Element right у Input ДС) */
          var clrBtn = t.closest('[data-sl-clear]');
          if (clrBtn) {
            e.preventDefault();
            slClearField(clrBtn);
            return;
          }
          /* Аккордеон категории: свернуть/развернуть все строки группы */
          var gfoldBtn = t.closest('[data-sl-gfold]');
          if (gfoldBtn) {
            e.preventDefault();
            var gName = gfoldBtn.getAttribute('data-sl-gfold');
            RT.sl.gfolds = RT.sl.gfolds || {};
            var gOff = !RT.sl.gfolds[gName];
            RT.sl.gfolds[gName] = gOff;
            var grp = gfoldBtn.parentElement;
            if (grp) grp.classList.toggle('is-collapsed', gOff);
            gfoldBtn.setAttribute('aria-expanded', gOff ? 'false' : 'true');
            var gIco = gfoldBtn.querySelector('.kds-sgroup__ico');
            if (gIco) slMi(gIco, gOff ? 'chevron_right' : 'expand_more');
            slSyncFoldAll();
            /* Высота списка изменилась — полоса прокрутки может стать не нужной (и наоборот) */
            slScrollSync();
            return;
          }
          /* «Свернуть все / Раскрыть все»: у каждой колонки своя кнопка и своя область —
             есть хоть одна раскрытая панель в этой колонке, сворачиваем все, иначе раскрываем */
          var gallBtn = t.closest('[data-sl-gfoldall]');
          if (gallBtn) {
            e.preventDefault();
            var inPaneCol = !!gallBtn.closest('.kds-split__pane--add');
            var gAll = inPaneCol
              ? RT.view.querySelectorAll('[data-sl-panegrp]')
              : ((RT.cfg && RT.cfg.split)
                  ? RT.view.querySelectorAll('[data-sl-body] .kds-sgrp--acc')
                  : RT.view.querySelectorAll('.kds-sgrp--acc'));
            var anyOpen = Array.prototype.some.call(gAll, function (g) { return !g.classList.contains('is-collapsed'); });
            RT.sl.gfolds = RT.sl.gfolds || {};
            Array.prototype.forEach.call(gAll, function (g) {
              g.classList.toggle('is-collapsed', anyOpen);
              /* Правая колонка: своё состояние (data-sl-panefold) и своя память */
              if (inPaneCol) {
                var ph = g.querySelector('[data-sl-panefold]');
                if (ph) {
                  if (RT.sl.pane) {
                    RT.sl.pane.folds = RT.sl.pane.folds || {};
                    RT.sl.pane.folds[ph.getAttribute('data-sl-panefold')] = anyOpen;
                  }
                  ph.setAttribute('aria-expanded', anyOpen ? 'false' : 'true');
                  var pi = ph.querySelector('.kds-sgroup__ico');
                  if (pi) slMi(pi, anyOpen ? 'chevron_right' : 'expand_more');
                }
                return;
              }
              var hb = g.querySelector('.kds-sgroup--acc');
              if (!hb) return;
              var nm = hb.getAttribute('data-sl-gfold');
              hb.setAttribute('aria-expanded', anyOpen ? 'false' : 'true');
              var hi = hb.querySelector('.kds-sgroup__ico');
              if (hi) slMi(hi, anyOpen ? 'chevron_right' : 'expand_more');
              if (nm) RT.sl.gfolds[nm] = anyOpen;
            });
            slSyncFoldAll();
            slScrollSync();
            return;
          }
          /* Свернуть/развернуть размеры позиции */
          var foldBtn = t.closest('[data-sl-fold]');          if (foldBtn) {
            var foldIdx = foldBtn.getAttribute('data-sl-fold');
            var foldOff = foldBtn.classList.toggle('is-collapsed');
            if (RT.sl.folds) RT.sl.folds[foldIdx] = foldOff;
            /* Сотрудник сам тронул шеврон — авто-сворачивание после внесения больше не применяем */
            RT.collapseNames = null;
            var foldIco = foldBtn.querySelector('.material-icons');
            if (foldIco) slMi(foldIco, foldOff ? 'chevron_right' : 'expand_more');
            var foldSubs = RT.view.querySelectorAll('.kds-srow--sub[data-sl-row="' + foldIdx + '"]');
            Array.prototype.forEach.call(foldSubs, function (sr) { sr.style.display = foldOff ? 'none' : ''; });
            slScrollSync();
            return;
          }
          var sclr = t.closest('[data-sl-sclear]');          if (sclr) {
            e.preventDefault();
            var sInp = RT.view.querySelector('[data-sl-search]');
            if (sInp) { sInp.value = ''; RT.sl.q = ''; applySlFilter(); syncSlClear(); }
            return;
          }
          var mic = t.closest('[data-sl-mic]');
          if (mic) { e.preventDefault(); slMic(); return; }
          var chk = t.closest('[data-sl-check]');
          if (chk) { toggleSlCheck(chk.getAttribute('data-sl-check')); return; }
          var sall = t.closest('[data-sl-selall]');
          if (sall) { slSelectAll(); return; }
          var wipe = t.closest('[data-sl-wipe]');
          if (wipe) { openSlConfirm(); return; }
          var ma = t.closest('[data-sl-massact]');
          if (ma) { slMass(ma.getAttribute('data-sl-massact')); return; }
          var pr = t.closest('[data-sl-print]');
          if (pr) { slBanner('Стоп-лист отправлен на печать'); return; }
          /* «В стоп» / «Снять ограничение» в строке — для блюда или отдельного размера (ключ «i:si») */
          var rstop = t.closest('[data-sl-rowstop]');
          if (rstop) {
            e.preventDefault();
            var rk = String(rstop.getAttribute('data-sl-rowstop')).split(':');
            var ri = +rk[0], rsz = rk.length > 1 ? +rk[1] : null;
            var rit = slData()[ri];
            if (rit) {
              if (rsz != null && rit.sizes && rit.sizes[rsz]) {
                rit.sizes[rsz].stop = true; rit.sizes[rsz].rest = '';
                refreshSl();
                slBanner('В полном стопе: ' + rit.name + ' ' + rit.sizes[rsz].s);
              } else {
                if (rit.sizes && rit.sizes.length) rit.sizes.forEach(function (sz) { sz.stop = true; sz.rest = ''; });
                else { rit.stop = true; rit.rest = ''; }
                refreshSl();
                slBanner('В полном стопе: ' + rit.name);
              }
            }
            return;
          }
          /* «Снять ограничение» в строке: у размера — только его ограничение, у блюда — позиция уходит из стоп-листа */
          var runstop = t.closest('[data-sl-rowunstop]');
          if (runstop) {
            e.preventDefault();
            var uk = String(runstop.getAttribute('data-sl-rowunstop')).split(':');
            var ui = +uk[0], usz = uk.length > 1 ? +uk[1] : null;
            var uit = slData()[ui];
            if (uit) {
              if (usz != null && uit.sizes && uit.sizes[usz]) {
                var uszName = uit.sizes[usz].s;
                uit.sizes[usz].stop = false; uit.sizes[usz].rest = null;
                /* Размер без ограничения уходит из списка; без размеров — уходит и блюдо */
                uit.sizes = uit.sizes.filter(function (s) { return s.stop || s.rest; });
                if (!uit.sizes.length) slData().splice(ui, 1);
                RT.sl.checks = {};
                refreshSl();
                slBanner('Удалено из стоп-листа: ' + uit.name + ' ' + uszName);
              } else {
                slData().splice(ui, 1);
                RT.sl.checks = {};
                refreshSl();
                slBanner('Удалено из стоп-листа: ' + uit.name);
              }
            }
            return;
          }
          var srow = t.closest('[data-sl-row]');
          if (srow) {
            /* тап по полю остатка — это правка числа, а не отметка строки */
            if (t.closest('[data-sl-in]')) return;
            /* строка размера — сразу в своё поле */
            /* на экране с панелями раскрытия размеры ведут себя как блюдо: тап по строке отмечает позицию */
            if (srow.hasAttribute('data-sl-si') && !(RT.cfg && RT.cfg.acc) && !(RT.sl.addMode && RT.cfg.multi)) { return; }
            /* Кликабельна вся строка целиком, а не только плашка с названием:
               поле ввода выходит отдельно (обработано выше), остальное — отметка строки */
            /* Исключённая из меню строка не кликабельна (pointer-events: none у блока блюда):
               ни панели, ни баннера — причину показывает красная подпись справа */
            if (t.closest('[data-sl-fail]')) return;
            /* Тап по блюду цифровую панель НЕ открывает: она появляется только по тапу
               в само поле «Количество» (focusin по [data-sl-in]). На экране с чекбоксами
               тап по строке — это отметка, как в стоп-листе */
            if (!RT.sl.addMode || RT.cfg.multi) toggleSlCheck(srow.getAttribute('data-sl-key') || srow.getAttribute('data-sl-row'));
            return;
          }
          /* тап мимо строки — ничего не делаем */
        }
        var stb = t.closest('[data-stopbtn]');
        /* Вход в стоп-лист с базы — с пустого стоп-листа (2-й экран): ограничений ещё нет,
           дальше всё происходит на том же экране — справа задают первое ограничение */
        if (stb) { e.stopPropagation(); render('list-empty'); return; }
        var pop = t.closest('[data-pop]');
        if (pop) {
          e.stopPropagation();
          if (pop.getAttribute('data-pop') === 'metrics') openMetrics(pop); else openSettings(pop);
          return;
        }
        var flt = t.closest('[data-filter]');
        if (flt) { e.stopPropagation(); toggleFilter(flt.getAttribute('data-filter')); return; }
        var sel = t.closest('[data-select]');
        if (sel) { e.stopPropagation(); openSelect(sel); return; }
        var act = t.closest('[data-act]');
        if (act) { e.stopPropagation(); doAct(act.getAttribute('data-act')); return; }
        var stub = t.closest('[data-ord]');
        if (stub) { e.stopPropagation(); listOrderAction(stub.getAttribute('data-ord')); return; }
        var row = t.closest('[data-rid]');
        if (row) {
          /* статус меняет только кнопка строки (52×52), а не вся строка:
             нажатие на название раскрывает полное название, а не меняет статус */
          if (t.closest('.kds-btn, .kds-kit__btn, .kds-dl-btn')) { rowAction(row.getAttribute('data-rid')); return; }
          closePop();
          return;
        }
        var course = t.closest('[data-course]');
        if (course) { courseAction(course.getAttribute('data-cid'), +course.getAttribute('data-course')); return; }
        var cardEl = t.closest('.kds-card[data-cid]');
        if (cardEl && t.closest('.kds-card__head')) {
          orderAction(cardEl.getAttribute('data-cid'));
          return;
        }
        closePop();
      });
      view.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { slEscClose(); }
      });
      if (!RT.escBound) {
        RT.escBound = true;
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { slEscClose(); }
        });
      }
      bindThumb(view);
    }
    /* ── Переключение экранов — только из панели ревью (ds-review.js) ── */
    window.DSReviewState = render;
    document.addEventListener('dsreview:state', function (e) { render(e.detail && e.detail.id || 'base'); });

    var initial = 'base';
    try { initial = new URL(location.href).searchParams.get('state') || 'base'; } catch (err) {}
    /* Старые ссылки на объединённые экраны ведут на общий список, а не на базу */
    initial = STATE_ALIAS[initial] || initial;
    /* Адрес приводим к новому state, чтобы панель ревью показала верный шаг */
    try {
      var u0 = new URL(location.href);
      if (u0.searchParams.get('state') && u0.searchParams.get('state') !== initial) {
        u0.searchParams.set('state', initial);
        history.replaceState(null, '', u0);
      }
    } catch (err) {}
    render(SCREENS[initial] ? initial : 'base');
    /* Иконки: Chrome открывает прототип по file://, и SVG-маски из icons.css в нём не грузятся
       (иконка ДС становится пустой). Поэтому здесь возвращаем глиф лигатурой: текст имени
       обратно в span, класс маски и data-ds-icon снимаем — рисует шрифт Material Icons из ДС */
    function slGlyphs(root) {
      var scope = root || document;
      if (!scope.querySelectorAll) return;
      var list = scope.querySelectorAll('span[data-ds-icon="1"]');
      for (var i = 0; i < list.length; i++) {
        var el = list[i], cls = '';
        for (var k = 0; k < el.classList.length; k++) {
          if (el.classList[k].indexOf('i-') === 0) { cls = el.classList[k]; break; }
        }
        if (!cls) continue;
        el.textContent = cls.slice(2);
        el.removeAttribute('data-ds-icon');
        el.removeAttribute('aria-hidden');
        el.classList.remove(cls);
      }
    }
    var slGlyphQ = false;
    function slGlyphsSoon(muts) {
      /* Пересобираем иконки только если в изменениях реально участвовали .material-icons:
         иначе любая запись текста (часы, счётчики) тянула полный проход по документу */
      if (muts && muts.length) {
        var touched = false;
        for (var i = 0; i < muts.length && !touched; i++) {
          var m = muts[i];
          var t = m.target;
          if (t && t.nodeType === 1 && t.classList && t.classList.contains('material-icons')) { touched = true; break; }
          var nodes = [].concat(Array.prototype.slice.call(m.addedNodes || []), Array.prototype.slice.call(m.removedNodes || []));
          for (var j = 0; j < nodes.length; j++) {
            var n = nodes[j];
            if (n.nodeType !== 1) continue;
            if (n.classList && n.classList.contains('material-icons')) { touched = true; break; }
            if (n.querySelector && n.querySelector('.material-icons')) { touched = true; break; }
          }
        }
        if (!touched) return;
      }
      if (slGlyphQ) return;
      slGlyphQ = true;
      requestAnimationFrame(function () { slGlyphQ = false; slGlyphs(document); });
    }
    if (window.MutationObserver) {
      new MutationObserver(slGlyphsSoon).observe(document.documentElement, { childList: true, subtree: true });
    }
    render(SCREENS[initial] ? initial : 'base');
    slGlyphs(document);
    window.addEventListener('load', function () { fitScale(); slGlyphs(document); });
    window.addEventListener('resize', fitScale);
    setTimeout(function () { fitScale(); slGlyphs(document); }, 600);
  })();
  </script>
</body>
