  .kds-split .kds-srow__add { width: 52px; height: 52px; margin-left: var(--ds-space-1x, 4px); }
  /* Рабочий экран: кнопки строки — заливка как у самого блюда (--picca-dish #212121), без обводки */
  .kds-split .kds-srow__acts .kds-srow__unstop,
  .kds-split .kds-srow__acts .kds-srow__stop,
  .kds-split .kds-srow__add { border: 0; background: var(--picca-dish); }
  /* Цвета иконок кнопок строк — одинаково на ВСЕХ экранах (палитра как на экранах 1–2):
     удаление — нейтральная Neutral/400 (#BDBDBD), «В стоп» — Negative (#FF5252),
     «В стоп-лист» — Warning (#FFAB40), недоступные — Neutral/700 (#616161):
     заметно темнее нейтральной, чтобы состояние читалось */
  .kds-srow__acts .kds-srow__unstop .material-icons { color: var(--ds-palette-neutral-400, #bdbdbd); }
  .kds-srow__acts .kds-srow__stop:not([disabled]) .material-icons { color: var(--kds-ic-negative); }
  .kds-srow__add:not([disabled]) .material-icons { color: var(--kds-ic-warning); }
  .kds-srow__acts .kds-srow__unstop[disabled] .material-icons,
  .kds-srow__acts .kds-srow__stop[disabled] .material-icons,
  .kds-view .kds-srow__add[disabled] .material-icons { color: var(--ds-palette-neutral-700, #616161); }
  /* Рабочий экран: аккордеон остаётся, рамки панелей убраны — блоки читаются по заливке шапки
     и отступу между ними. Селектор сильнее .kds-view--dishbg .kds-sgrp--acc */
  .kds-view .kds-slist--split .kds-sgrp--acc { border: 0; border-radius: 0; }
  /* Свёрнутая шапка без рамки — самостоятельная плашка: радиус со всех сторон, а не только сверху */
  .kds-view .kds-slist--split .kds-sgrp--acc.is-collapsed .kds-sgroup--acc { border-radius: 12px; }
  /* Рабочий экран, левая колонка: заголовки категорий скрыты — все блюда одним списком.
     Ряды категорий остаются контейнерами, поэтому шаг между строками везде одинаковый (4) */
  .kds-view .kds-slist--split [data-sl-body] { gap: 0; }
  .kds-view .kds-slist--split [data-sl-body] .kds-sgroup--acc { display: none; }
  /* Один ритм без панелей: 4 между блюдами — как в правой панели, где строки идут через 4.
     Отступы строк обнулены — расстояние задают только margin'ы, поэтому оно ровное */
  .kds-view .kds-slist--split .kds-sbody[data-sl-body] .kds-sgrp--acc { padding-bottom: 0; }
  .kds-view .kds-slist--split .kds-sbody[data-sl-body] .kds-sgrp--acc > .kds-srow { padding: 0; }
  .kds-view .kds-slist--split .kds-sbody[data-sl-body] > .kds-sgrp + .kds-sgrp { margin-top: 4px; }
  .kds-view .kds-slist--split .kds-sbody[data-sl-body] .kds-sgrp--acc > .kds-srow + .kds-srow { margin-top: 4px; }
  /* Рабочий экран, правая панель: у недоступной строки плашка чуть бледнее — Neutral/900 из палитры ДС */
  /* Рабочий экран, правая панель: у недоступной строки нет заливки — вместо неё рамка Stroke/Default
     (#616161), как у недоступной кнопки справа. Промежуточного тона в палитре между
     Neutral/950 и фоном нет, поэтому состояние даёт обводка, а не заливка */
  /* Недоступная строка (позиция уже в стоп-листе): без заливки и без рамки, но ширина
     и положение остаются прежними (чистое место вместо плашки).
     Одинаково на рабочем экране и в панели добавления */
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow.is-off-row > .kds-srow__top > .kds-srow__plate {
    background: transparent;
    border: 0;
    box-sizing: border-box; }
  /* Исключение по просьбе заказчика: у «Мясной» недоступная строка (блюдо и размеры)
     остаётся с аутлайном — показательный пример такого состояния.
     Тон аутлайна — Neutral/800 #424242 (--kds-divider), а не Stroke/Default #616161:
     яркая рамка у недоступной строки перетягивала внимание (24.11.2026: «сделай потусклее,
     ранее тоже так делали») — как контур блюд в «Пицце» из эталона 12.11 */
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow.is-off-outline > .kds-srow__top > .kds-srow__plate {
    background: transparent;
    border: 1px solid var(--kds-off-outline, #424242);
    box-sizing: border-box; }
  /* Такую строку нельзя ни выбрать, ни нажать — курсор обычный, чекбокс и кнопка
     невидимы, но занимают место: ширина строки остаётся прежней */
  .kds-view .kds-srow.is-off-row, .kds-view .kds-srow.is-off-row .kds-srow__check { cursor: default; }
  .kds-view .kds-srow.is-off-row:not(.is-off-outline) .kds-srow__check,
  .kds-view .kds-srow.is-off-row:not(.is-off-outline) .kds-srow__add { visibility: hidden; }
  /* Рабочий экран, правая панель: строки без боковых отступов 16 — плашка и кнопка идут от края до края */
  .kds-view .kds-slist--split .kds-split__pane--add .kds-sgrp--acc > .kds-srow { padding-left: 0; padding-right: 0; }
  /* Размеры в панели добавления — вложенность 24, как у блюда с вложенными строками на 1-м экране (kds-nest).
     Здесь строки-блюда стоят без бокового паддинга 16, поэтому общий отступ «16 + 24» давал 40 — убираем лишние 16 */
  .kds-view .kds-slist--split .kds-split__pane--add .kds-sgrp--acc > .kds-srow.kds-srow--sub {
    width: calc(100% - var(--ds-space-6x, 24px));
    margin-left: var(--ds-space-6x, 24px); }
  /* «Свернуть все» остаётся только у правой панели: в левой списке сворачивать нечего */
  .kds-view .kds-slist--split .kds-shead [data-sl-gfoldall] { display: none; }
  /* Рабочий экран: «Полный стоп» — подпись ПОД названием, компонент Caption L ДС (400 12/16, трекинг .5),
     как .kds-srow__cap в строках панели добавления; цвет — Negative. Название занимает свою строку */
  .kds-view .kds-slist--split [data-sl-body] .kds-srow__l1 { flex-wrap: wrap; row-gap: 0; }
  .kds-view .kds-slist--split [data-sl-body] .kds-sstop {
    flex: 1 0 100%; margin: 0; white-space: nowrap;
    font: var(--ds-font-caption-l-12-normal-regular, 400 12px/16px 'Roboto');
    letter-spacing: var(--ds-font-caption-l-12-normal-regular-spacing, .5px); }
  /* Подписи-капшены в левом списке — тоже Caption L, чтобы совпадали с «Полный стоп» */
  .kds-view .kds-slist--split [data-sl-body] .kds-srow__cap {
    font: var(--ds-font-caption-l-12-normal-regular, 400 12px/16px 'Roboto');
    letter-spacing: var(--ds-font-caption-l-12-normal-regular-spacing, .5px); }
  /* Полоса над списком: поле поиска + кнопки («Добавить позицию» — акцент, «Печать» — обводка) */
  /* Полоса действий — на всю ширину области списка */
  .kds-shead { display: flex; align-items: center; gap: var(--ds-space-2x, 8px);
    width: 100%; flex-wrap: wrap; }
  /* Поле поиска — компонент Search ДС (.ds-search / __icon / __label / __right-icon / __clear):
     геометрию, отступы 12, зазор 8, радиус 12 и состояния берём у компонента,
     а цвета задаём через его же переменные значениями из палитры КДС */
  .kds-ssearch {
    --ds-color-search-background: transparent;
    --ds-color-search-default-border-color: var(--kds-line);
    --ds-color-search-hover-border-color: var(--kds-line);
    --ds-color-search-focus-border-color: var(--kds-ic-accent);
    --ds-color-search-default-text-color: var(--kds-text-3);
    --ds-color-search-focus-text-color: var(--kds-text-3);
    --ds-color-text-primary: var(--kds-text);
    --ds-color-icon-primary: var(--kds-text-2);
  }
  /* Поле в шапке: постоянная ширина, прижато к правому краю блока шапки */
  .kds-ssearch--tb { flex: 0 1 480px; min-width: 160px; width: 480px; margin-left: auto; }
  /* Кнопки полосы — всегда у правого края, даже если поле поиска не растягивается */
  .kds-shead__btns { margin-left: auto; }
  .kds-ssearch .material-icons { font-size: 20px; }
  /* Плейсхолдер поиска — ТА ЖЕ типографика, что у Input number в строке: 16/24 · 500,
     Empty — --kds-text-3, Focus — --kds-text-2 (Form-Field-Input ДС, fixes.css п.16) */
  .kds-ssearch .ds-search__label::placeholder { font-size: 16px; line-height: 24px; font-weight: 500;
    letter-spacing: .25px; color: var(--kds-text-3); }
  .kds-ssearch .ds-search__label:focus::placeholder { color: var(--kds-text-2); }
  /* Голосовой поиск — второй слот right-icon (сенсорный терминал может быть без клавиатуры) */
  .kds-ssearch.is-listen { border-color: var(--kds-ic-negative); }
  .kds-ssearch.is-listen .kds-ssearch__mic { color: var(--kds-ic-negative); }
  .kds-ssearch.is-listen .kds-ssearch__mic .material-icons { animation: kds-mic 1s ease-in-out infinite; }
  @keyframes kds-mic { 0%, 100% { color: var(--kds-ic-negative); } 50% { color: var(--ds-palette-negative-400, #ff8585); } }
  /* Кнопки стоп-листа: цвета — ТОЛЬКО переменные КДС (--kds-ic-accent / negative / positive),
     заливка — в тоне кнопок строк --kds-btn; обводка — --kds-line */
  .kds-btn-acc, .kds-btn-out, .kds-btn-neutral, .kds-btn-warn, .kds-btn-warn-out, .kds-btn-neg, .kds-btn-neg-out, .kds-btn-acc-out { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 14px 16px; border-radius: 12px; flex: 0 0 auto;
    font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
  /* Неактивная кнопка любого вида — ВСЯ кнопка в состоянии Disable (Button/Disable в ДС):
     текст Text/Disable, рамка нейтральная вместо цветной, иконка тоже гаснет */
  .kds-btn[disabled], .kds-btn-out[disabled], .kds-btn-neutral[disabled], .kds-btn-warn[disabled], .kds-btn-warn-out[disabled], .kds-btn-neg-out[disabled],

  /* У полей ВО ВСЕХ панелях — фон экрана (--kds-bg #121212) и рамка --kds-line (#616161) */
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val .ds-input__frame,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val.is-off .ds-input__frame,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val.is-off .ds-input__frame:hover,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val .ds-input__frame:hover,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val .ds-input__frame:focus-within {
    border-color: var(--kds-line) !important;
    background-color: var(--kds-bg) !important; }
  /* Поле исключённой из меню позиции (.is-off) — свой фон экрана + та же рамка */
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val.is-off .ds-input__frame,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val.is-off .ds-input__frame:hover {
    border-color: var(--kds-line) !important; }
  .kds-view--rowframe .kds-sgrp--acc .kds-srow__val { padding-right: var(--ds-space-4x, 16px); }
  /* Первая строка — без дивидера, только отступ от шапки */
  .kds-sgrp--acc > .kds-sgroup--acc + .kds-srow { padding-top: var(--ds-space-2x, 8px); }
  .kds-sgroup--acc { display: flex; align-items: center; gap: var(--ds-space-2x, 8px);
    padding: var(--ds-space-3x, 12px) var(--ds-space-4x, 16px); border: 0; border-radius: 12px 12px 0 0;
    background: var(--kds-row);  /* #212121 — card-food/food-list/background из Figma */
    margin-bottom: 0;  /* у обычного заголовка категории отбивка 4 — здесь её даёт gap панели */
    font: 500 16px/24px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .5px;
    color: var(--kds-ic-warning); text-align: left; text-transform: none; }
  .kds-sgroup--acc:active { background: rgba(255, 255, 255, .08); }
  .kds-sgroup__t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Счётчик позиций категории — сразу после названия, той же типографикой, что у заголовка */
  .kds-sgroup__n { flex: 0 0 auto; margin-right: auto; font: inherit; letter-spacing: inherit;
    color: inherit; }
  /* «В полном стопе N» — после счётчика категории, красным; пустой, если в полном стопе ничего нет */
  .kds-sgroup__stopn { margin-left: var(--ds-space-4x, 16px); color: var(--kds-ic-negative); }
  /* Шеврон раскрытия — 20, цвет варнинга (в Figma он единственный цветной элемент шапки) */
  .kds-sgroup__ico { flex: 0 0 auto; font-size: 20px; color: var(--kds-ic-warning); }
  /* Шеврон позиции с размерами — 52×52, как все кнопки, стоящие в строчке блюда */
  .kds-sgrp--acc .kds-srow__fold { flex: 0 0 52px; width: 52px; height: 52px;
    margin: 0; padding: 0; border-radius: 8px; color: var(--kds-ic-warning); }
  /* Строка блюда с шевроном — тоже 52: шеврон задаёт высоту, вертикальные паддинги убираем
     (иначе 52 + 4 + 4 = 60 и строка выше остальных) */
  .kds-view .kds-sgrp--acc .kds-srow__main:has(.kds-srow__fold) { padding-top: 0; padding-bottom: 0; }
  .kds-sgrp--acc .kds-srow__fold .material-icons { font-size: 20px; }
  /* Шеврон стоит в правом краю коробки названия — по одному x для всех строк,
     а не сразу за названием: иначе он гуляет по строке от длины названия до длины подписи */
  .kds-sgrp--acc .kds-srow__main .kds-srow__meta { margin-left: auto; }
  .kds-sgrp--acc .kds-srow__main { gap: var(--ds-space-2x, 8px); }
  /* Строки размеров — вложены на 24 (--ds-space-6x) от края КОНТЕНТА блюда, как на экране с панелями
     и как в базе (kds-nest): паддинг строки блюда + 24. margin, а не padding — дивидер
     тянется только по ширине самой строки размера. Правый край при этом совпадает
     с краем строк блюд (иначе поля «шт» у размеров стояли левее, чем у блюд) */
  .kds-sbody .kds-sgrp--acc .kds-srow--sub {
    width: calc(100% - var(--ds-space-2x, 8px) - var(--ds-space-6x, 24px));
    margin-left: calc(var(--ds-space-2x, 8px) + var(--ds-space-6x, 24px));
    padding-left: 0; padding-right: var(--ds-space-2x, 8px); }
  /* Кликабельна вся строка панели, поэтому и курсор-указатель — на всей строке,
     кроме поля ввода (там правка числа) и заблокированной позиции */
  .kds-sgrp--acc .kds-srow { cursor: pointer; }
  .kds-sgrp--acc .kds-srow .ds-input__field { cursor: text; }
  .kds-sgrp--acc .kds-srow__val.is-off, .kds-sgrp--acc .kds-srow__val.is-off .ds-input__field,
  .kds-sgrp--acc .kds-srow__main.is-off { cursor: default; }
  /* Свёрнутая группа: строки скрыты, заголовок остаётся */
  .kds-sgrp.is-collapsed > .kds-srow { display: none; }
  .kds-sbody::-webkit-scrollbar { width: 0; height: 0; }
  /* Строка позиции: коробка #212121 r8, высота 52, название 22/28 Medium #fff (ширину задаёт раскладка списка) */
  .kds-srow { background: transparent; }
  .kds-srow__top { display: flex; align-items: stretch; min-height: 52px; gap: var(--ds-space-4x, 16px); }
  /* Коробка блюда (#212121 r8): чекбокс + название. Input number — ЗА коробкой, в колонке значений */
  .kds-srow__box { flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch;
    background: var(--kds-row); border-radius: 8px; overflow: hidden; }
  .kds-srow__main { flex: 1 1 auto; min-width: 0; padding: var(--ds-space-1x, 4px) var(--ds-space-2x, 8px);
    display: flex; flex-direction: row; align-items: center; gap: var(--ds-space-4x, 16px); cursor: pointer; }
  /* Зоны строки: название тянется, служебная подпись — справа, вплотную к блоку остатка */
  .kds-srow__namecol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .kds-srow__meta { flex: 0 0 auto; min-width: 0; display: flex; align-items: center; justify-content: flex-end; }
  /* Служебный текст строки — Support text ДС: 16/24, второй цвет */
  .kds-srow__meta-t { font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-text-2); white-space: nowrap; }
  /* Причина отказа — красным (палитра КДС), чтобы отличалась от нейтральных подписей */
  .kds-srow__meta-t--danger { color: var(--kds-ic-negative); }
  /* У размера чекбокса нет — тот же отступ слева, что у названия блюда, иначе размер висит левее родителя */
  .kds-srow--sub .kds-srow__main { padding-left: var(--ds-space-2x, 8px); }
  /* В узком кадре служебная подпись прячется — название важнее */
  .kds-view--narrow .kds-srow__meta { display: none; }
  .kds-srow__name { font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: .25px; color: var(--kds-text); white-space: nowrap;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* Подпись под названием — тот же компонент, что подпись гостя в базе (.kds-guest):
     12/16, трекинг .4, цвет --kds-text-3 (#D6D6D6) */
  .kds-srow__cap { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--kds-text-3); }
  /* Аккордеон позиции: шеврон 44 — цель пальцем, как у чекбокса; только у строк с размерами */
  .kds-srow__fold { flex: 0 0 44px; width: 44px; height: 44px; margin-right: -4px; border: 0; border-radius: 8px;
    background: transparent; color: var(--kds-text-2); display: flex; align-items: center; justify-content: center; }
  .kds-srow__fold .material-icons { font-size: 24px; }
  .kds-srow__fold:active { background: rgba(255, 255, 255, .08); }
  /* «Полный стоп» — после названия, мельче (16/24) и с отступами */
  .kds-sstop { flex: 0 0 auto; margin: 0 8px; font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .4px;
    color: var(--kds-ic-negative); }
  /* Время постановки в стоп внутри подписи — цвет служебного текста, не красный */
  .kds-sstop__when { color: var(--kds-text-2); }
  /* Название + метка состояния — в одну строку, выровнены по НИЖНЕМУ краю (не по центру) */
  .kds-srow__l1 { display: flex; align-items: flex-end; gap: 4px; min-width: 0; }
  /* Полный стоп — состояние под названием, красным (как раньше красная подпись в строке) */
  .kds-srow__cap.is-stop { color: var(--kds-ic-negative); }  /* Чекбокс режима выбора — слева у строки */
  .kds-srow__check { flex: 0 0 52px; width: 52px; border: 0; background: transparent; color: var(--kds-text-2);
    display: flex; align-items: center; justify-content: center; }
  .kds-srow__check .material-icons { font-size: 28px; }
  .kds-srow__check.is-on { color: var(--kds-ic-accent); }
  /* Исключённую из меню позицию выбрать нельзя — чекбокс неактивен (состояние Disable) */
  .kds-srow__check[disabled] { color: var(--ds-palette-neutral-700, #616161); cursor: default; }
  /* Отмеченная строка — полупрозрачный тинт accent 12 %, без бордеров */
  .kds-srow.is-sel .kds-srow__box { background: rgba(68, 138, 255, .12); }
  /* Полный стоп — тот же тинт, но красный */
  .kds-srow.is-stop .kds-srow__box { background: rgba(255, 82, 82, .12); }
  /* Экран с панелями раскрытия: при отметке подсвечивается ВСЯ строка (во всю ширину панели),
     а не только плашка с названием — поэтому тинт с коробки снимаем */
  .kds-sgrp--acc .kds-srow.is-sel { background: rgba(68, 138, 255, .12); }
  .kds-sgrp--acc .kds-srow.is-sel .kds-srow__box { background: transparent; }
  /* «Полный стоп» — подсветка на всю строку, а не на плашку названия;
     поле при этом сохраняет свой фон (#212121), а не суммирует красный тинт */
  .kds-sgrp--acc .kds-srow.is-stop { background: rgba(255, 82, 82, .12); }
  .kds-sgrp--acc .kds-srow.is-stop .kds-srow__box { background: transparent; }
  .kds-view .kds-sgrp--acc.kds-sgrp--acc .kds-srow.is-stop .kds-srow__val .ds-input__frame { background-color: var(--kds-bg) !important; }
  /* Поле остатка всегда в фоне экрана (#121212) — и в полном стопе, и в отмеченной строке */
  .kds-view .kds-srow.is-stop .kds-srow__val .ds-input__frame,
  .kds-view .kds-srow.is-stop .kds-srow__val .ds-input__frame:hover,
  .kds-view .kds-srow.is-stop .kds-srow__val .ds-input__frame:focus-within { background-color: var(--kds-bg) !important; }
  .kds-view .kds-srow.is-sel .kds-srow__val .ds-input__frame,
  .kds-view .kds-srow.is-sel .kds-srow__val .ds-input__frame:hover,
  .kds-view .kds-srow.is-sel .kds-srow__val .ds-input__frame:focus-within {
    background-color: var(--kds-bg) !important; }
  /* Экран с панелями раскрытия: поле остатка — обычное состояние Input ДС,
     рамка больше не скрывается (вернули как на остальных экранах) */
  .kds-srow__main:active { background: rgba(255, 255, 255, .08); }
  /* На экране с панелями строка — одно целое: отклик на нажатие тоже по всей строке,
     а не только по плашке названия */
  .kds-sgrp--acc .kds-srow:active { background: rgba(255, 255, 255, .08); }
  .kds-sgrp--acc .kds-srow__main:active { background: transparent; }
  .kds-srow__check:active { background: rgba(255, 255, 255, .08); }
  /* Размеры позиции — как в Figma 10628:57825: отдельные строки-коробки 52 с отступом 24 слева
     (правая кромка по списку), название 22/28, остаток — своё поле в строке */
  /* Вложенный уровень — как в базе (kds-nest__rows): отступ 24 (--ds-space-6x), зазор 4 */
  .kds-sbody .kds-srow--sub { width: calc(100% - var(--ds-space-6x, 24px)); margin-left: var(--ds-space-6x, 24px); }
  /* Остаток — прямо в строке (заказчик 10.11.2026: «зачем лишние шаги»): вместо ✎ и диалога —
     поле 52 в тоне кнопок строки (#424242 r8), число 22/28 справа, единица — рядом, ВНЕ поля
     (в Input ДС справа только иконочный слот, текстового суффикса нет) */
  .kds-srow__val { flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding-right: var(--ds-space-2x, 8px); }
  /* «Добавить» — отдельное действие строки внесения, отбито от блока остатка:
     8 у блока + 8 у кнопки = 16 от «шт» */
  .kds-srow__top > .kds-btn-acc { margin-left: var(--ds-space-2x, 8px); }
  /* Проба: блюдо и поле остатка — ОДИН блок (поле внутри коробки названия).
     Отбивка до поля та же, что была между коробкой и полем: 8 у названия + 16 */
  .kds-srow__top--merged .kds-srow__val { margin-left: var(--ds-space-4x, 16px); }
  /* Остаток: кнопки шага 52×52 как у кнопок строк базы + поле ДС Input (M, 48) между ними */
  .kds-srow__val .kds-btn { height: 52px; }
  /* Плейсхолдер 16/24 500 — состояния Form-Field-Input ДС (fixes.css, п.16):
     Empty — цвет лейбла (в тёмной палитре kds-text-3), Focus — приглушённый (kds-text-2).
     Одна типографика у поля в строке и у поля в цифровой панели */
  .kds-srow__num .ds-input__field::placeholder,
  .kds-numpad__field .ds-input__field::placeholder { font-size: 16px; line-height: 24px; font-weight: 500;
    color: var(--kds-text-3); }
  .kds-srow__num .ds-input__field:focus::placeholder,
  .kds-numpad__field .ds-input__field:focus::placeholder { color: var(--kds-text-2); }
  /* Плейсхолдер «0» — той же величины, что и значение (22/28 700): пустое поле
     не должно выглядеть мельче соседних. Отличие от значения — только цвет (третичный).
     Одинаково в строке списка и в цифровой панели: после крестика «0» не «сжимается» */
  .kds-srow__num .ds-input__field::placeholder,
  .kds-numpad__field .ds-input__field::placeholder { font: 700 22px/28px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .25px; }
  /* Общее поле блюда с размерами: «разные» — служебная подсказка, а не значение.
     Цвет Disable ДС и нормальное начертание, чтобы слово не читалось как число */
  .kds-srow__num .ds-input__field[data-sl-mixed]::placeholder {
    font: 500 22px/28px 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    color: var(--ds-color-text-disable, #9e9e9e);
  }
  /* Сброс значения — слот Element right у Input ДС: иконка 20, цель нажатия 48,
     видна только когда в поле есть значение (пустое поле показывает плейсхолдер) */
  .kds-srow__clear { width: 48px; height: 48px; margin: -12px -12px -12px 0; padding: 0;
    border: 0; background: transparent; color: var(--kds-text-2); display: none;
    align-items: center; justify-content: center; border-radius: 8px; }
  .kds-srow__clear .material-icons { font-size: 20px; }
  .kds-srow__clear:active { background: rgba(255, 255, 255, .08); }
  .kds-srow__num:has(.ds-input__field:not(:placeholder-shown)) .kds-srow__clear { display: inline-flex; }
  /* Пустой слот у строк с размерами — ровно ширина блока значения, иначе правая кромка
     коробок не сходится: шагов «−/+» больше нет, значит слот = поле 152 + 8 + единица 48 + 8 */
  .kds-srow__val--blank { width: 216px; }
  /* Там, где нет крестика сброса, поле уже 108 — резерв под значение тоже уже (108 + 8 + 48 + 8 = 172) */
  .kds-srow__val--blank.kds-srow__val--compact { width: 172px; }
  /* Поле шире: при цели 120 промахнуться мимо ввода и попасть в «×» было слишком легко */
  .kds-srow__val .ds-input { width: 152px; }
  /* Экран внесения: крестика сброса в поле нет — и поле уже ровно на его место (48 − 12 margin − 8 gap = 44),
     текст в числе остаётся той же ширины, что и с крестиком */
  .kds-srow__val--compact .ds-input { width: 108px; }
  /* Кнопка «В стоп-лист» в строке панели добавления: Outlined-акцент 48,
     отбита от блока количества на 8 — как «Добавить позицию» в полосе */
  /* Действие строки внесения — иконка 52×52: плюс, как у «Добавить позицию» — значит «добавить» */
  .kds-srow__add { margin-left: var(--ds-space-2x, 8px); width: 52px; height: 52px; padding: 0; }
  .kds-srow__add .material-icons { font-size: 24px; }
  /* Внесение (панели): плашка блюда — как в стоп-листе (инпут ВНУТРИ неё),
     а кнопка «В стоп-лист» — отдельным блоком справа, вне плашки */
  .kds-srow__plate { flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch;
    gap: var(--ds-space-4x, 16px); }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__add) > .kds-srow__top,
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__stop) > .kds-srow__top {
    background: transparent; padding-right: 0; }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__add) .kds-srow__plate,
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__stop) .kds-srow__plate {
    background: var(--picca-dish); border-radius: 8px; }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__add).is-sel > .kds-srow__top,
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__stop).is-sel > .kds-srow__top { background: transparent; }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__add).is-sel .kds-srow__plate,
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__stop).is-sel .kds-srow__plate {
    background: linear-gradient(rgba(68, 138, 255, .12), rgba(68, 138, 255, .12)), var(--picca-dish); }
  /* Позиция в полном стопе — розовый тинт, как на остальных экранах */
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__stop).is-stop > .kds-srow__top { background: transparent; }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow:has(.kds-srow__stop).is-stop .kds-srow__plate {
    background: linear-gradient(rgba(255, 82, 82, .12), rgba(255, 82, 82, .12)), var(--picca-dish); }
  /* «В стоп» и «Снять ограничение» в строке — ДВЕ иконочные кнопки 48×48 рядом
     (красный и акцентный аутлайн), отдельным блоком справа от плашки */
  .kds-srow__acts { display: flex; align-items: center; gap: var(--ds-space-2x, 8px);
    margin-left: var(--ds-space-2x, 8px); }
  .kds-srow__stop, .kds-srow__unstop { width: 52px; height: 52px; padding: 0; }
  .kds-srow__acts .material-icons { font-size: 24px; }
  .kds-srow__acts button[disabled] { border-color: var(--kds-line); color: var(--kds-text-2); }
  .kds-srow__acts button[disabled] .material-icons { color: inherit; }
  /* Строки размеров тоже с кнопками: плашка — как у блюда (box + поле), кнопки стоят отдельно, вне неё */
  .kds-view--dishbg .kds-sgrp--acc .kds-srow--sub:has(.kds-srow__stop) > .kds-srow__top {
    background: transparent; padding-right: 0; }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow--sub:has(.kds-srow__stop) .kds-srow__plate {
    background: var(--picca-dish); border-radius: 8px; }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow--sub:has(.kds-srow__stop).is-sel > .kds-srow__top,
  .kds-view--dishbg .kds-sgrp--acc .kds-srow--sub:has(.kds-srow__stop).is-stop > .kds-srow__top {
    background: transparent; }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow--sub:has(.kds-srow__stop).is-sel .kds-srow__plate {
    background: linear-gradient(rgba(68, 138, 255, .12), rgba(68, 138, 255, .12)), var(--picca-dish); }
  .kds-view--dishbg .kds-sgrp--acc .kds-srow--sub:has(.kds-srow__stop).is-stop .kds-srow__plate {
    background: linear-gradient(rgba(255, 82, 82, .12), rgba(255, 82, 82, .12)), var(--picca-dish); }
  /* Поле — в палитре КДС: тёмная коробка в фоне экрана с обводкой #616161, число белое 22/28 700 */
  .kds-srow__val .ds-input__frame { width: 100%; background: var(--kds-bg); border-color: var(--kds-line); }
  /* Тёмная заливка поля не должна зависеть от порядка подключения стилей ДС:
     правила с префиксом .kds-view перебивают любые светлые состояния Input */
  .kds-view .kds-srow__val .ds-input__frame,
  .kds-view .kds-numpad__field .ds-input__frame { background-color: var(--kds-bg) !important; }
  .kds-view .ds-input__field { background-color: transparent !important; color: var(--kds-text);
    -webkit-text-fill-color: currentColor; caret-color: var(--kds-ic-accent); }
  /* Состояния поля тоже держим в палитре КДС — светлые состояния Input ДС сюда не проникают */
  .kds-view .kds-srow__val .ds-input__frame:hover,
  .kds-view .kds-srow__val .ds-input__frame:focus-within,
  .kds-view .kds-srow__val .ds-input__frame:has(.is-focus) { background-color: var(--kds-bg) !important; }
  .kds-srow__val .ds-input__frame:hover { background: var(--kds-bg); border-color: var(--kds-text-2); }
  .kds-srow__val .ds-input__frame:focus-within { background: var(--kds-bg); border-color: var(--kds-ic-accent); }
  /* Экран-состояние «поле в фокусе»: тот же акцент, что и при реальном фокусе (§6 #6–8) */
  .kds-srow__val .ds-input__frame:has(.is-focus) { border-color: var(--kds-ic-accent); }
  /* Выделение значения — в палитре КДС: системный светлый highlight на тёмном давал белую плашку
     на секунду при смене экрана (значение выделяется автофокусом, §5.12.7) */
  .kds-view ::selection { background: rgba(68, 138, 255, .38); color: var(--kds-text); }
  /* Переход фона ДС (0,15 с) при перерисовке экрана давал светлую вспышку заливки поля */
  .kds-srow__val .ds-input__frame, .kds-numpad__field .ds-input__frame { transition: none; }
  /* Позиция исключена из меню: недоступно только поле ввода (сам Input приглушён).
     Единица измерения — это подпись, а не часть поля, поэтому её не гасим */
  .kds-view .kds-srow__val.is-off { cursor: default; }
  /* Disable — штатное состояние Input ДС: гасим ЦВЕТОМ текста (Text/Disable = Neutral/500 #9e9e9e),
     opacity не используем никогда — в ДС его нет */
  .kds-view .kds-srow__val.is-off .ds-input__frame,
  .kds-view .kds-srow__val.is-off .ds-input__frame:hover { border-color: var(--kds-line); }
  .kds-view .kds-srow__val.is-off .ds-input__field { color: var(--ds-color-text-disable, #9e9e9e); cursor: default; }
  /* Фон поля в Disable — как фон плашки блюда (а не фон экрана): поле не проваливается
     «дыркой» в ленте. Правила фона ниже заданы !important, поэтому перекрываем здесь */
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val.is-off .ds-input__frame,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val.is-off .ds-input__frame:hover,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow .kds-srow__top .kds-srow__val.is-off .ds-input__frame:focus-within,
  .kds-view .kds-srow__val.is-off .ds-input__frame,
  .kds-view .kds-srow__val.is-off .ds-input__frame:hover,
  .kds-view .kds-srow__val.is-off .ds-input__frame:focus-within {
    background-color: var(--picca-dish, #212121) !important; }
  /* «Мясная» (и другие строки с аутлайном): у поля в Disable фон не показываем —
     состояние читается по обводке строки, поле остаётся только контуром */
  .kds-view .kds-srow.is-off-outline .kds-srow__val.is-off .ds-input__frame,
  .kds-view .kds-srow.is-off-outline .kds-srow__val.is-off .ds-input__frame:hover,
  .kds-view .kds-srow.is-off-outline .kds-srow__val.is-off .ds-input__frame:focus-within,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow.is-off-outline .kds-srow__top .kds-srow__val.is-off .ds-input__frame,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow.is-off-outline .kds-srow__top .kds-srow__val.is-off .ds-input__frame:hover,
  .kds-view.kds-view--dishbg .kds-slist .kds-sgrp--acc .kds-srow.is-off-outline .kds-srow__top .kds-srow__val.is-off .ds-input__frame:focus-within {
    background-color: transparent !important; }
  .kds-view .kds-srow__val.is-off .kds-btn[disabled] { color: var(--ds-color-text-disable, #9e9e9e); cursor: default; }
  /* Само блюдо тоже в состоянии Disable: название приглушено, тап не подсвечивает строку */
  .kds-view .kds-srow__main.is-off { cursor: default; pointer-events: none; }
  .kds-view .kds-srow__main.is-off .kds-srow__name { color: var(--ds-color-text-disable, #9e9e9e); }
  .kds-view .kds-srow__main.is-off:active { background: transparent; }
  /* Одиночное внесение: название блюда — только подпись, а не кнопка. Цифровая панель
     открывается исключительно тапом в поле «Количество», поэтому строка не ловит тап
     и не показывает состояние нажатия (иначе выглядит кликабельной, но ничего не делает) */
  .kds-view .kds-srow__main.is-static { cursor: default; pointer-events: none; }
  .kds-view .kds-srow__main.is-static:active { background: transparent; }
  .kds-srow__val .ds-input--error .ds-input__frame { background: var(--kds-row); border-color: var(--kds-ic-negative); }
  /* Значение — крупно, 22/28 как плашка количества базы, а не 16/24 из десктопного Input.
     Одна анатомия у поля в строке и у поля ввода в цифровой панели */
  .kds-srow__val .ds-input__field, .kds-numpad__field .ds-input__field {
    font: 700 22px/28px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .25px; color: var(--kds-text); }
  /* Подсказка «0» — это ПЛЕЙСХОЛДЕР, а не значение: цвет Text/Disable (#9e9e9e),
     размер и начертание прежние (22/28 700), чтобы «0» не выглядел мельче значения.
     Раньше подсказка была белой, как само значение, и нельзя было понять,
     введён 0 (полный стоп) или поле пустое. В Disable (.is-off) — прежний серый текст */
  .kds-view .kds-srow__val:not(.is-off) .ds-input__field::placeholder,
  .kds-view .kds-numpad__field .ds-input__field::placeholder { color: var(--ds-color-text-disable, #9e9e9e); opacity: 1; }
  .kds-view .kds-srow__val:not(.is-off) .ds-input__field:focus::placeholder,
  .kds-view .kds-numpad__field .ds-input__field:focus::placeholder { color: var(--ds-color-text-disable, #9e9e9e); }
  /* Подсказка цифровой панели — текст «Введите остаток», а не цифра: обычная
     типографика подсказки (16/24 500), чтобы фраза не читалась как значение */
  .kds-view .kds-numpad__field .ds-input__field::placeholder,
  .kds-view .kds-numpad__field .ds-input__field:focus::placeholder {
    font: 500 16px/24px 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: .25px; color: var(--kds-text-2); }
  /* За скриншотом клавиатуры: показывать белый фон над полем */
  /* Экранная клавиатура — стандартная андроидная для планшета: четыре ряда клавиш 52,
     нижний ряд [?123] [,] [RU/EN] [пробел] [.] [↵]. Появляется по тапу в поле поиска:
     на терминале системной клавиатуры нет */
  .kds-kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15;
    display: flex; flex-direction: column; gap: 8px; padding: 8px;
    background: #212121; border-top: 1px solid var(--kds-line); }
  .kds-kbd[hidden] { display: none; }
  .kds-kbd__row { display: flex; gap: 6px; justify-content: center; }
  .kds-kbd__k { flex: 1 1 0; min-width: 0; height: 52px; padding: 0 4px; border: 1px solid var(--ds-palette-neutral-500, #9e9e9e); border-radius: 8px;
    background: var(--kds-btn); color: var(--kds-text);
    font: 400 20px/28px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .5px;
    display: flex; align-items: center; justify-content: center; }
  .kds-kbd__k:active { background: #4a4a52; }
  .kds-kbd__k--act { flex: 1.6 1 0; background: #2e2e33; color: var(--kds-text-3); font-size: 16px; }
  .kds-kbd__k--on { background: #fff; color: #121212; }
  .kds-kbd__k--enter { flex: 1.6 1 0; background: var(--kds-btn-accent); color: #fff; }
  .kds-kbd__k--space { flex: 4.2 1 0; }
  .kds-kbd__k .material-icons { font-size: 22px; }
  .kds-kbd__hint { padding: 0 8px; font: 400 12px/16px 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: .5px; color: var(--kds-text-2); }
  /* Цифровая панель — та же, что была в панели остатка: поверхность меню (#333, r12, рамка #616161,
     тень), клавиши 52 с обводкой 1px #616161 r12, три равные колонки, «Сохранить» во всю ширину.
     Всегда по центру кадра */
  /* Цифровая панель — над панелью внесения (z 8): поле остатка открывает её прямо из панели */
  .kds-numpad { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9;
    width: 560px; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px;
    background: var(--kds-pop); border: 1px solid var(--kds-line); border-radius: 12px;
    box-shadow: var(--kds-pop-shadow); }
  .kds-numpad[hidden] { display: none; }
  /* Отступ до кнопок: поле → сетка 8 (gap панели) + 8 = 16, сетка → «Сохранить» остаётся 8 */
  .kds-numpad__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: var(--ds-space-2x, 8px); }
  /* Клавиши — залитые плашки без рамки: они не должны читаться как кнопки диалога.
     Кнопки действий ниже — аутлайн, поэтому клавиши и действия не сливаются */
  .kds-numpad__k { height: 60px; padding: 0; border: 0; border-radius: 12px;
    background: var(--kds-row); color: var(--kds-text); display: flex; align-items: center; justify-content: center;
    font: 500 24px/32px 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
  .kds-numpad__k .material-icons { font-size: 26px; color: var(--kds-text); }
  .kds-numpad__k:active { filter: brightness(1.4); }
  /* Действия панели: на экране внесения сверху — «В стоп-лист» на всю ширину,
     под ней в один ряд — «Закрыть» и «Сохранить» по половине ширины.
     Отступы задаются только здесь: gap 8 и между рядами, и между кнопками в ряду.
     Отступ от цифровой сетки до ряда действий — 24 (gap панели 8 + 16) */
  .kds-numpad__acts { display: flex; flex-wrap: wrap; gap: var(--ds-space-2x, 8px); margin-top: var(--ds-space-4x, 16px); }
  .kds-numpad__cancel, .kds-numpad__done { flex: 1 1 0; width: auto; height: 56px; }
  /* «Сохранить» пока скрыта: значение из панели сразу пишется в поле строки, а панель закрывают «Закрыть» */
  .kds-numpad__done[hidden] { display: none; }
  /* Дополнительное действие экрана внесения — отдельной строкой выше; вид общих кнопок не меняет */
  .kds-numpad__add { flex: 1 1 100%; width: 100%; height: 56px; }
  .kds-numpad__add[hidden] { display: none; }
  /* Выбор размера в панели ввода: те же кнопки ДС, что и везде в терминале — Button/Neutral/Outlined
     для невыбранного и Button/Warning/Outlined для выбранного (классы kds-btn-out / kds-btn-warn-out).
     Здесь только раскладка: до четырёх кнопок в ряд, дальше — перенос строкой (без прокрутки) */
  .kds-numpad__sizes { display: flex; flex-wrap: wrap; gap: var(--ds-space-2x, 8px); }
  .kds-numpad__sizes[hidden] { display: none; }
  /* Кнопки по ширине своего текста: в строку встаёт столько, сколько влезает,
     остальные переносятся. Паддинги — родные, из кнопки ДС */
  .kds-numpad__size { flex: 0 0 auto; }
  /* Панель по центру и закрывает строку — поэтому вводимое значение видно в ней самой: название позиции,
     поле в состоянии фокуса (тот же Input M) и единица */
  /* Заголовок (блюдо, единица) отбит от блока ввода на 16 — как секции формы в ДС;
     внутри блока «лейбл → поле» — 4 */
  .kds-numpad__head { display: flex; flex-direction: column; gap: var(--ds-space-4x, 16px); }
  /* Название позиции — Header S (20/28 500), единица — рядом в той же строке, тот же шрифт,
     только приглушённым цветом */
  /* Название позиции и единица — одна строка, один шрифт и один цвет: «Фокачча, шт» */
  .kds-numpad__title { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
  .kds-numpad__name, .kds-numpad__unit { font-size: 20px; line-height: 28px; font-weight: 500;
    letter-spacing: .25px; color: var(--kds-text); }
  .kds-numpad__name { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kds-numpad__name::after { content: ','; }
  .kds-numpad__unit { flex: 0 0 auto; }
  .kds-numpad__disp { display: flex; flex-direction: column; gap: var(--ds-space-2x, 8px); }
  /* Лейбл «Остаток» — ВНЕ поля, над ним (заказчик 12.11.2026): 14/20 (body-s ДС), белый, отступ 8 до поля */
  .kds-numpad__label { font-size: 14px; line-height: 20px; letter-spacing: .25px; color: var(--kds-text); }
  .kds-numpad__field { flex: 1 1 auto; min-width: 0; }
  .kds-numpad__field .ds-input { width: 100%; }
  /* Крестик внутри поля панели (Element right у Input ДС) — сброс всего значения сразу;
     виден только когда в поле есть значение */
  .kds-numpad__field .kds-numpad__clear { display: none; flex: 0 0 auto; width: 40px; height: 40px;
    margin: 0 -8px 0 4px; padding: 0; border: 0; background: transparent; color: var(--kds-text-2);
    align-items: center; justify-content: center; border-radius: 8px; }
  .kds-numpad__field .kds-numpad__clear .material-icons { font-size: 20px; }
  .kds-numpad__field .kds-numpad__clear:active { background: rgba(255, 255, 255, .08); }
  .kds-numpad__field:has(.ds-input__field:not(:placeholder-shown)) .kds-numpad__clear { display: inline-flex; }
  .kds-view--light .kds-numpad__field .kds-numpad__clear:active { background: rgba(0, 0, 0, .08); }
  /* Поле панели — обычный Input ДС со своими состояниями: рамка Default в покое,
     акцентная — только когда поле в фокусе (не «акцент навсегда») */
  .kds-numpad__field .ds-input__frame { background: var(--kds-row); border-color: var(--kds-line); }
  .kds-numpad__field .ds-input__frame:focus-within { border-color: var(--kds-ic-accent); }
  /* ошибка ввода — внутри панели, под полем: Support/Error text ДС */
  .kds-numpad__err { display: none; margin-top: var(--ds-space-1x, 4px);
    font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-ic-negative); }
  .kds-numpad__err.is-on { display: block; }
  /* Сброс значения — последняя клавиша сетки цифровой панели (крестик close),
     крестика внутри поля больше нет ни на одном экране */
  /* Уровень ограничения переключается не в строке блюда — служебного сегмент-контрола в блоке
     позиции нет; показ размеров задаёт экран */
  /* Единица — колонка постоянной ширины (по самому длинному «порц»), текст мельче значения:
     16/24, как Support text ДС, чтобы не спорить с числом 22/28 */
  .kds-srow__unit { flex: 0 0 auto; min-width: 48px;
    font: 400 16px/24px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .25px;
    color: var(--kds-text-2); white-space: nowrap; }
  /* Поле остатка — без собственной подписи ошибки: текст валидации живёт в цифровой панели,
     красная рамка — состояние Input/Error ДС */
  /* Крестики закрытия в диалогах — цель нажатия 52 (видимые 24 + невидимые 14 вокруг), правило КДС */
  .kds-sconfirm__head .kds-iconbtn::after { inset: -14px; }
  /* Пустой стоп-лист */
  /* Пустое состояние — по центру области списка внутри рамки: фон прозрачный и не ловит тапы */
  .kds-sempty { flex: 1 1 auto; min-height: 0; position: relative; top: auto; bottom: auto; left: auto; right: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    pointer-events: none; }
  .kds-sempty > * { pointer-events: auto; }
  .kds-sempty__t { font-size: 22px; font-weight: 500; line-height: 28px; color: var(--kds-text); }
  .kds-sempty__d { font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-text-3); margin-bottom: 8px; }
  /* Поиск ничего не нашёл */
  .kds-snone { padding: 24px 16px; text-align: center; font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-text-2); }

    function slIconRemember(node) {

    function slMenuAvail(stopItems) {

         строками размеров (очистка поля, крестик, «Снять ограничение») — общее поле
         не должно одним «Закрыть» выкидывать позицию из стоп-листа */
      if (!raw && !RT.sl.addMode) { slSyncGroupField(i); return true; }
      if (!raw && g.hasAttribute('data-sl-mixed')) { slSyncGroupField(i); return true; }
      if (RT.sl.addMode) {
        /* Внесение: поле только набирает число — позицию вносит кнопка строки */
        it.sizes.forEach(function (sz) {
          sz.rest = pr.empty ? null : (pr.val === 0 ? '0' : fmtRest(pr.val));
        });
        /* Значение задано всем размерам — строки размеров сворачиваем (как в стоп-листе):
           сводная строка блюда показывает общее значение. Состояние «в стопе» фиксируем,
           чтобы авто-раскрытие slSyncFolds не развернуло строки обратно */
        RT.sl.folds = RT.sl.folds || {};
        RT.sl.folds[i] = true;
        RT.sl.stopWas = RT.sl.stopWas || {};
        RT.sl.stopWas[it.name] = slIsStopped(it);
        slRerender();
        return true;
      }
      /* Стоп-лист: пусто — ограничения нет, 0 — полный стоп, число — остаток.
         Как при правке одного размера, только сразу всем */
      it.sizes.forEach(function (sz) {
        if (pr.empty) { sz.stop = false; sz.rest = null; }
        else if (pr.val === 0) { sz.stop = true; sz.rest = ''; }
        else { sz.stop = false; sz.rest = fmtRest(pr.val); }
      });
      /* Ограничений не осталось ни у одного размера — позиция уходит из стоп-листа */
      if (!slRestricted(it)) { slDropItem(i); slRerender(); return true; }
      /* Значение задано сразу всем размерам — строки размеров сворачиваем:
         сводная строка блюда показывает общее значение (заказчик 19.11.2026).
         Состояние «в стопе» фиксируем, чтобы авто-раскрытие в slSyncFolds не мешало
         (словарь stopWas инициализируем здесь же — иначе slSyncFolds перезапишет folds) */
      RT.sl.folds = RT.sl.folds || {};
      RT.sl.folds[i] = true;
      RT.sl.stopWas = RT.sl.stopWas || {};
      RT.sl.stopWas[it.name] = slIsStopped(it);
      slRerender();
      return true;
    }
    /* Общее поле показывает модель: общее значение / пусто / «разные» */
    function slSyncGroupField(i) {
      if (!RT.view) return;
      var g = RT.view.querySelector('[data-sl-in="' + i + '"][data-sl-group]');
      if (!g) return;
      var it = slData()[i];
      if (!it || !it.sizes || !it.sizes.length) return;
      var v = slAddGroupVal(it);
      if (v.mixed) {
        g.value = '';
        g.setAttribute('data-sl-mixed', '');
        g.setAttribute('placeholder', 'разные');
      } else {
        g.value = v.val;
        g.removeAttribute('data-sl-mixed');
        g.setAttribute('placeholder', '0');
      }
      slRowErr(g, false);
    }
    /* Поля размеров перерисовываются из модели — без перерисовки всего списка */
    function slSyncSizeFields(i) {
      if (!RT.view) return;
      var it = slData()[i];
      if (!it || !it.sizes) return;
      it.sizes.forEach(function (sz, si) {
        var inp = RT.view.querySelector('[data-sl-in="' + i + '"][data-sl-si="' + si + '"]');
        if (!inp) return;
        inp.value = sz.rest != null ? String(sz.rest) : '';
        inp.__slDone = false;
        slRowErr(inp, false);
      });
    }
    /* Ошибка значения — только состояние Input ДС (красная рамка).
       Текст ошибки живёт в цифровой панели (над клавишами), а не под строкой блюда */
    function slRowErr(inp, on) {
      var box = inp && inp.closest ? inp.closest('.ds-input') : null;
      /* Ошибки заполнения показываем ТОЛЬКО в панели цифр: на поле строки красную
         рамку не включаем — иначе значение висит красным без объяснения */
      if (box && !on) box.classList.remove('ds-input--error');
      /* Если панель открыта на этом поле — текст ошибки в ней обновляем сразу */
      if (!on && RT.sl && inp && RT.sl.padInp === inp) slPadSync();
    }
    /* Размеры рендерятся отдельными строками блюда в slRowHtml — отдельной функции нет */
    /* ── Сохранение остатка из строки: пусто — ограничения нет, 0 — полный стоп, число — остаток.
       Enter и уход из поля сохраняют сразу — без кнопок и диалогов (заказчик 10.11.2026) ── */
    function slRerender() {
      var bodyEl = RT.view && RT.view.querySelector('[data-sl-body]');
      var st = bodyEl ? bodyEl.scrollTop : 0;
      refreshSl();
      bodyEl = RT.view && RT.view.querySelector('[data-sl-body]');
      if (bodyEl) bodyEl.scrollTop = st;
    }
    function slCommit(inp) {
      var i = +inp.getAttribute('data-sl-in');
      var si = inp.hasAttribute('data-sl-si') ? +inp.hasAttribute('data-sl-si') : null;
      /* Один и тот же ввод сохраняем ровно один раз: при перерисовке строки браузер
         присылает change уже снятому с документа полю — второй раз удалять/писать нельзя */
      if (inp.__slDone) return false;
      inp.__slDone = true;
      /* Поле правой панели: значение остаётся в панели, в список ничего не пишем —
         позиция уходит в стоп-лист только кнопкой «В стоп-лист» */
      if (inp.hasAttribute && inp.hasAttribute('data-sl-pane')) {
        var prP = parseRest(inp.value);
        if (!prP.ok) { slRowErr(inp, true); return false; }
        slRowErr(inp, false);
        inp.value = prP.empty ? '' : (prP.val === 0 ? '0' : fmtRest(prP.val));
        if (RT.sl && RT.sl.pane && RT.sl.pane.vals) {
          RT.sl.pane.vals[inp.getAttribute('data-sl-pane-key')] = inp.value;
        }
        /* Строка блюда с размерами — значение сразу всем размерам (как на экранах внесения);
           правка одного размера обновляет сводную строку («разные», если разошлись) */
        if (inp.hasAttribute('data-sl-group')) slPaneGroupToSizes(inp, false);
        else if (inp.hasAttribute('data-sl-si')) slPaneSizesToGroup(+inp.getAttribute('data-sl-in'), false);
        return true;
      }
      var it = slData()[i];
      if (!it) return false;
      var sz = si != null ? it.sizes[si] : it;
      var pr = parseRest(inp.value);
      if (!pr.ok) {
        slRowErr(inp, true);
        if (RT.sl && RT.sl.padInp === inp) slPadSync();
        return false;
      }
      slRowErr(inp, false);
      /* Общее поле блюда с размерами — одинаково на внесении и в стоп-листе:
         значение сразу всем размерам */
      if (inp.hasAttribute('data-sl-group')) return slApplyGroup(i, inp);
      if (RT.sl.addMode) {
        /* Внесение: позицию добавляет кнопка строки — поле только запоминает число */
        var nv = pr.empty ? null : (pr.val === 0 ? '0' : fmtRest(pr.val));
        if (si != null) sz.rest = nv; else it.rest = nv;
        inp.value = pr.empty ? '' : nv;
        if (si != null) slSyncGroupField(i);   /* поменялось у размера — обновляем общее поле */
        return true;
      }
      if (pr.empty) {
        /* Пустое поле = ограничения нет: строка уходит из стоп-листа */
        if (si != null) {
          sz.stop = false; sz.rest = null;
          if (!it.sizes.some(function (s) { return s.stop || s.rest; })) slDropItem(i);
        } else {
          slDropItem(i);
        }
      } else if (pr.val === 0) {
        sz.stop = true; sz.rest = '';
        inp.value = '0';                      /* 0 — полный стоп: в поле цифра 0, состояние дублирует подпись */
      } else {
        sz.stop = false; sz.rest = fmtRest(pr.val);
        inp.value = sz.rest;
      }
      /* Значения размеров сошлись — одна строка блюда; разошлись — строки размеров */
      if (RT.cfg && RT.cfg.flatSizes && it.sizes && it.sizes.length && slData()[i] === it) {
        RT.sl.folds = RT.sl.folds || {};
        if (slSizesUniform(it)) RT.sl.folds[i] = true;
        else delete RT.sl.folds[i];
      }
      slRerender();
      return true;
    }
    /* ── Цифровая панель: ручной ввод остатка пальцем ── */
    function slPadHide() {
      var padEl = RT.view && RT.view.querySelector('[data-sl-numpad]');
      if (padEl) padEl.hidden = true;
      if (RT.sl) { RT.sl.padInp = null; RT.sl.padDish = null; RT.sl.padPick = null; RT.sl.padDirty = false; }
    }
    /* Отказ от ввода: возвращаем значение, которое было до открытия панели,
       и убираем ошибку — невалидное значение не должно остаться «текущим».
       Живой ввод (slPadLive) пишет значение сразу в модель, поэтому при открытии
       панели снимаем снимок позиции и восстанавливаем его при отказе */
    function slPadRevert() {
      var inp = RT.sl && RT.sl.padInp;
      var dishIdx = RT.sl ? RT.sl.padDish : null;
      var snap = RT.sl ? RT.sl.padSnapshot : null;
      if (inp) {
        inp.value = RT.sl.padOrig == null ? '' : RT.sl.padOrig;
        inp.__slDone = true;
      }
      var padEl = RT.view && RT.view.querySelector('[data-sl-numpad]');
      if (padEl) {
        var f = padEl.querySelector('[data-sl-pad-val]');
        if (f) {
          f.value = inp ? inp.value : '';
          var bx = f.closest('.ds-input');
          if (bx) bx.classList.remove('ds-input--error');
        }
        var errEl = padEl.querySelector('[data-sl-pad-err]');
        if (errEl) errEl.classList.remove('is-on');
      }
      /* Живой ввод уже записал значение в модель — возвращаем снимок, сделанный при открытии */
      if (snap && dishIdx != null) {
        var itRev = slData()[dishIdx];
        try {
          var s0 = JSON.parse(snap);
          if (itRev) {
            itRev.stop = s0.stop; itRev.rest = s0.rest;
            if (itRev.sizes && s0.sizes) {
              itRev.sizes.forEach(function (sz, si) {
                var q = s0.sizes[si];
                if (q) { sz.stop = q.stop; sz.rest = q.rest; }
              });
            }
          }
        } catch (e) { /* снимок битый — ничего не восстанавливаем */ }
        slPersist();
        slRerender();
        slPaneRender();
      }
      if (RT.sl) RT.sl.padSnapshot = null;
      slPadHide();
    }
    /* Esc — закрыть всё, что открыто: панель цифр, диалог подтверждения, попап */
    function slEscClose() {
      var padEl = RT.view && RT.view.querySelector('[data-sl-numpad]');
      if (padEl && !padEl.hidden) {
        var inp = RT.sl && RT.sl.padInp;
        if (inp) {
          if (!slPadValidate()) { slPadRevert(); return; }
          if (RT.cfg && RT.cfg.flatSizes && RT.sl.padDirty && RT.sl.padDish != null) slPadApply();
          else slCommit(inp);
          inp.blur();
        }
        slPadHide();
      }
      closePop(); closeSlConfirm();
    }
    /* Панель закрывает строку — вводимое значение дублируем в ней (название, число, единица) */
    function slPadSync() {
      var padEl = RT.view && RT.view.querySelector('[data-sl-numpad]');
      if (!padEl) return;
      var inp = RT.sl && RT.sl.padInp;
      var v = inp ? String(inp.value == null ? '' : inp.value) : '';
      var valEl = padEl.querySelector('[data-sl-pad-val]');
      /* Пустое значение остаётся пустым (в поле виден плейсхолдер «0» серым): иначе стёртое
         значение выглядело как набранный 0, то есть как полный стоп, хотя это «ограничения нет» */
      if (valEl && valEl.value !== v) valEl.value = v;
      var nameEl = padEl.querySelector('[data-sl-pad-name]');
      if (nameEl) nameEl.textContent = (RT.sl && RT.sl.padName) || '';
      var unitEl = padEl.querySelector('[data-sl-pad-unit]');
      if (unitEl) unitEl.textContent = (RT.sl && RT.sl.padUnit) || '';
      /* Строка правой панели: значение уже в её поле (Input ДС); общее поле
         дублируем во все строки размеров */
      if (inp && inp.hasAttribute && inp.hasAttribute('data-sl-pane') && RT.view) {
        if (inp.hasAttribute('data-sl-group')) slPaneGroupToSizes(inp, true);
        else if (inp.hasAttribute('data-sl-si')) slPaneSizesToGroup(+inp.getAttribute('data-sl-in'), true);
      }
      slPadValidate();
    }
    /* Валидация значения в панели: 0 — полный стоп, пусто — ограничения нет,
       иначе 0,001…999,999 и не больше 3 знаков. Красная рамка — состояние Input/Error ДС */
    function slPadValidate() {
      var padEl = RT.view && RT.view.querySelector('[data-sl-numpad]');
      if (!padEl) return true;
      var f = padEl.querySelector('[data-sl-pad-val]');
      var pr = parseRest(f ? f.value : '');
      var ok = pr.ok && (pr.empty || pr.val === 0 || (pr.val >= 0.001 && pr.val <= 999.999));
      var box = f && f.closest ? f.closest('.ds-input') : null;
      if (box) box.classList.toggle('ds-input--error', !ok);
      /* ошибка показывается ВНУТРИ панели, под полем */
      var errEl = padEl.querySelector('[data-sl-pad-err]');
      if (errEl) errEl.classList.toggle('is-on', !ok);
      /* Невалидное значение — сохранять и вносить нечего: «Сохранить» и «В стоп-лист»
         недоступны, пока значение не исправят */
      var doneEl = padEl.querySelector('.kds-numpad__done');
      if (doneEl) doneEl.disabled = !ok;
      var addEl = padEl.querySelector('[data-sl-pad-add]');
      if (addEl) addEl.disabled = !ok;
      return ok;
    }
    /* Панель ввода: выбор цели — «Все размеры» или конкретный размер */
    function slPadPick(id) {
      if (!RT.sl || RT.sl.padDish == null) return;
      RT.sl.padPick = id === 'all' ? 'all' : +id;
      RT.sl.padDirty = false;      /* показали значение выбранного размера — ещё ничего не изменили */
      var padEl = RT.view.querySelector('[data-sl-numpad]');
      Array.prototype.forEach.call(padEl.querySelectorAll('[data-sl-pad-size]'), function (b) {
        /* выбранный вариант — Button/Warning/Outlined, остальные — Button/Neutral/Outlined */
        b.className = 'kds-numpad__size ' + (b.getAttribute('data-sl-pad-size') === String(id) ? 'kds-btn-warn-out' : 'kds-btn-out');
      });
      /* в поле панели — значение выбранной цели */
      var it = slData()[RT.sl.padDish];
      var v = '';
      if (it) {
        if (RT.sl.padPick === 'all') {
          var gv = slAddGroupVal(it);
          v = gv.mixed ? '' : (gv.val == null ? '' : String(gv.val));
        } else {
          var sz = it.sizes[RT.sl.padPick];
          if (sz) v = sz.stop ? '0' : (sz.rest != null ? String(sz.rest) : '');
        }
      }
      var f = padEl.querySelector('[data-sl-pad-val]');
      if (f) f.value = v;
      /* подпись в шапке панели — только название блюда, размер выбирается кнопками ниже */
      if (it) {
        var unitEl = padEl.querySelector('[data-sl-pad-unit]');
        var tgtRow = RT.sl.padPick === 'all'
          ? null
          : RT.view.querySelector('[data-sl-row="' + RT.sl.padDish + '"][data-sl-si="' + RT.sl.padPick + '"]');
        if (unitEl) {
          var uEl = tgtRow && tgtRow.querySelector('.kds-srow__unit');
          /* «Все размеры» — единица та же, что у размеров: не обнуляем */
          if (uEl) unitEl.textContent = uEl.textContent.trim();
        }
      }
      slPadValidate();
    }
    /* Панель ввода: применить значение к выбранной цели */
    function slPadApply() {
      var it = RT.sl && RT.sl.padDish != null ? slData()[RT.sl.padDish] : null;
      var padEl = RT.view && RT.view.querySelector('[data-sl-numpad]');
      if (!it || !padEl) return false;
      var f = padEl.querySelector('[data-sl-pad-val]');
      var pr = parseRest(f ? f.value : '');
      if (!pr.ok) return false;
      /* Блюдо без размеров — цель одна: его собственный остаток/стоп */
      if (!it.sizes || !it.sizes.length) {
        if (pr.empty) { slDropItem(RT.sl.padDish); slRerender(); return true; }
        if (pr.val === 0) { it.stop = true; it.rest = ''; }
        else { it.stop = false; it.rest = fmtRest(pr.val); }
        slRerender();
        return true;
      }
      var idxs = RT.sl.padPick === 'all' ? it.sizes.map(function (_, si) { return si; }) : [+RT.sl.padPick];
      idxs.forEach(function (si) {
        var sz = it.sizes[si];
        if (!sz) return;
        if (pr.empty) { sz.stop = false; sz.rest = null; }
        else if (pr.val === 0) { sz.stop = true; sz.rest = ''; }
        else { sz.stop = false; sz.rest = fmtRest(pr.val); }
      });
      /* ни одного ограничения не осталось — позиция уходит из стоп-листа */
      if (!it.sizes.some(function (s) { return s.stop || s.rest; })) slDropItem(RT.sl.padDish);
      /* Все размеры снова с одним значением — в списке одна строка блюда */
      if (RT.cfg && RT.cfg.flatSizes && slData()[RT.sl.padDish] === it && slSizesUniform(it)) {
        RT.sl.folds = RT.sl.folds || {};
        RT.sl.folds[RT.sl.padDish] = true;
      }
      slRerender();
      return true;
    }
    /* Панель ввода: живое применение значения к выбранной цели — строка сразу
       показывает новое значение и перестаёт быть «Полный стоп» (без перерисовки списка) */
    function slPadLive() {
      var it = RT.sl && RT.sl.padDish != null ? slData()[RT.sl.padDish] : null;
      var padEl = RT.view && RT.view.querySelector('[data-sl-numpad]');
      if (!it || !padEl) return;
      var f = padEl.querySelector('[data-sl-pad-val]');
      var pr = parseRest(f ? f.value : '');
      if (!pr.ok) return;
      /* Блюдо без размеров — обновляем его строку точечно */
      if (!it.sizes || !it.sizes.length) {
        if (pr.empty) { it.stop = false; it.rest = null; }
        else if (pr.val === 0) { it.stop = true; it.rest = ''; }
        else { it.stop = false; it.rest = fmtRest(pr.val); }
        var rowPlain = RT.view.querySelector('.kds-srow[data-sl-key="' + RT.sl.padDish + '"]');
        if (rowPlain) {

          if (riPlain) riPlain.value = pr.empty ? '' : (pr.val === 0 ? '0' : fmtRest(pr.val));
          slSstopSync(rowPlain, it);
        }
        slPersist();
        syncSl();
        return;
      }
      var idxs = RT.sl.padPick === 'all' ? it.sizes.map(function (_, si) { return si; }) : [+RT.sl.padPick];
      idxs.forEach(function (si) {
        var sz = it.sizes[si];
        if (!sz) return;
        if (pr.empty) { sz.stop = false; sz.rest = null; }
        else if (pr.val === 0) { sz.stop = true; sz.rest = ''; }
        else { sz.stop = false; sz.rest = fmtRest(pr.val); }
        /* строка размера — точечно, чтобы поле ввода не теряло фокус */
        var row = RT.view.querySelector('[data-sl-row="' + RT.sl.padDish + '"][data-sl-si="' + si + '"]');
        if (!row) return;
        var ri = row.querySelector('[data-sl-in]');
        if (ri) ri.value = pr.empty ? '' : (pr.val === 0 ? '0' : fmtRest(pr.val));
        row.classList.toggle('is-stop', !!sz.stop);
        var l1 = row.querySelector('.kds-srow__l1');
        var badge = l1 && l1.querySelector('.kds-sstop');
        if (sz.stop && l1 && !badge) {
          badge = document.createElement('span');
          badge.className = 'kds-sstop';
          badge.innerHTML = slSstopInner('Полный стоп', it.name + ' ' + sz.s);
          l1.appendChild(badge);
        } else if (!sz.stop && badge) {
          badge.parentNode.removeChild(badge);
        }
        var meta = row.querySelector('.kds-srow__meta');
        if (meta) {
          var mt = meta.querySelector('.kds-srow__meta-t');
          var line = (sz.stop && !(RT.cfg && RT.cfg.split)) ? slStopLine(it.name + ' ' + sz.s) : '';
          if (line && !mt) { mt = document.createElement('span'); mt.className = 'kds-srow__meta-t'; meta.appendChild(mt); }
          if (mt) { if (line) mt.textContent = line; else mt.parentNode.removeChild(mt); }

        if (unstopBtn) unstopBtn.disabled = !slRestricted(sz);

      syncSl();

    /* Иконка-лигатура в КДС часто уже превращена icons.js в SVG-маску ДС (класс i-<имя>,

       а не только текст — иначе чекбокс/шеврон визуально остаётся прежним */
    function slMi(el, name) {
      if (!el) return;
      if (el.getAttribute('data-ds-icon') === '1') {
        var cls = String(el.className || '').split(/\s+/).filter(function (c) { return c && c.indexOf('i-') !== 0; });
        cls.push('i-' + name.replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase());
        el.className = cls.join(' ');
        el.textContent = '';
      } else {
        el.textContent = name;
      }
    }
    function slRowsHtml(items) {
      var html = '';
      var acc = !!(RT.cfg && RT.cfg.acc);
      /* Панели сортируются по названию категории (А→Я); порядок позиций внутри сохраняется */
      var buckets = {}, order = [];
      items.forEach(function (it, i) {
        var c = slCat(it);
        if (!buckets[c]) { buckets[c] = []; order.push(c); }
        buckets[c].push({ it: it, i: i });
      });
      order.sort(function (a, b) { return String(a || '').localeCompare(String(b || ''), 'ru'); });
      /* По умолчанию свёрнуты все панели, КРОМЕ первой в списке — она раскрыта.
         На рабочем экране список короткий, поэтому раскрыты все категории */
      if (acc && RT.sl && !RT.sl.gfoldsInit) {
        RT.sl.gfolds = RT.sl.gfolds || {};
        var firstCat = null;
        var openAll = !!(RT.cfg && RT.cfg.split);
        order.forEach(function (c) { if (!firstCat && c) firstCat = c; });
        order.forEach(function (c) { if (c) RT.sl.gfolds[c] = !openAll && (c !== firstCat); });
        RT.sl.gfoldsInit = true;
      }
      order.forEach(function (c) {
        var gOff = !!(acc && RT.sl.gfolds && RT.sl.gfolds[c]);
        html += '<div class="kds-sgrp' + (acc ? ' kds-sgrp--acc' : '') + (gOff ? ' is-collapsed' : '') + '">' +
          (c
            ? (acc
                ? '<button class="kds-sgroup kds-sgroup--acc" type="button" data-sl-gfold="' + esc(c) + '" aria-expanded="' + (gOff ? 'false' : 'true') + '">' +
                    '<span class="material-icons kds-sgroup__ico">' + (gOff ? 'chevron_right' : 'expand_more') + '</span>' +
                    '<span class="kds-sgroup__t">' + esc(c) + '</span>' +
                    '<span class="kds-sgroup__n">' + buckets[c].length +
                      /* «В полном стопе N» — только в стоп-листе: на внесении счётчик относился бы к стоп-листу,
                         а не к списку внесения, и путал */
                      (RT.sl && RT.sl.addMode ? '' : '<span class="kds-sgroup__stopn" data-sl-gstopn="' + esc(c) + '"></span>') +
                    '</span>' +
                  '</button>'
                : '<div class="kds-sgroup">' + esc(c) + '</div>')
            : '');
        buckets[c].forEach(function (e) { html += slRowHtml(e.it, e.i); });
        html += '</div>';
      });
      return html;
    }
    function slRowHtml(it, i) {
      if (RT.sl.addMode) {

           + акцентная кнопка «Добавить» (Button/Accent ДС).
           В режиме множественного внесения (cfg.multi) — ещё и чекбокс слева */
        var mChk = RT.cfg.multi
          ? '<button class="kds-srow__check' + (RT.sl.checks[i] ? ' is-on' : '') + (it._fail ? ' is-off' : '') + '" type="button" data-sl-check="' + i + '"' + (it._fail ? ' disabled aria-disabled="true"' : '') + '><span class="material-icons">' + (RT.sl.checks[i] ? 'check_box' : 'check_box_outline_blank') + '</span></button>'
          : '';
        /* Позиция с размерами — как в стоп-листе: строка блюда-заголовка, под ней раскрыты
           строки размеров (своё поле у каждого). В заголовке поля нет — значения живут у размеров */
        if (it.sizes && it.sizes.length) {

          var szTotal = (it.sizesTotal && it.sizesTotal > it.sizes.length) ? it.sizesTotal : 0;
          var szCap = szTotal
            ? it.sizes.length + ' из ' + szTotal + ' размеров'
            : it.sizes.length + ' ' + slSizePlur(it.sizes.length);
          var szFoldOff = !!RT.sl.folds[i] && !it.offOutline;   /* «Мясная»: размеры не сворачиваем */
          var szFold = RT.cfg.acc
            ? '<button class="kds-srow__fold' + (szFoldOff ? ' is-collapsed' : '') + '" type="button" data-sl-fold="' + i + '" aria-label="Свернуть/развернуть размеры"><span class="material-icons">' + (szFoldOff ? 'chevron_right' : 'expand_more') + '</span></button>'
            : '';
          /* Всё блюдо уже в стоп-листе — строка остаётся на месте, но недоступна */
          var rowOff = slLiveInStop(it, null);
          var mChkRow = RT.cfg.multi
            ? '<button class="kds-srow__check' + ((rowOff || it._fail) ? ' is-off' : (RT.sl.checks[i] ? ' is-on' : '')) + '" type="button" data-sl-check="' + i + '"' + ((rowOff || it._fail) ? ' disabled aria-disabled="true"' : '') + '><span class="material-icons">' + ((rowOff || it._fail) ? 'check_box_outline_blank' : (RT.sl.checks[i] ? 'check_box' : 'check_box_outline_blank')) + '</span></button>'
            : '';
          /* Уже внесённое блюдо — чекбокс остаётся в разметке (ширина строки не меняется),
             но невидим и недоступен */
          return '<div class="kds-srow' + (RT.sl.checks[i] ? ' is-sel' : '') + (rowOff ? ' is-off-row' : '') + (rowOff && it.offOutline ? ' is-off-outline' : '') + '" data-sl-row="' + i + '" data-sl-key="' + i + '" data-sl-name="' + esc(it.name) + '">' +
            '<div class="kds-srow__top">' +
              (RT.cfg.rowAdd ? '<div class="kds-srow__plate">' : '') +
              '<div class="kds-srow__box">' + mChkRow +
                '<div class="kds-srow__main' + (RT.cfg.multi ? '' : ' is-static') + (rowOff ? ' is-off' : '') + '">' +
                  '<div class="kds-srow__namecol">' +
                    '<div class="kds-srow__l1"><span class="kds-srow__name">' + esc(it.name) + '</span></div>' +
                    '<span class="kds-srow__cap">' + esc(szCap) + '</span>' +
                  '</div>' +
                  '<div class="kds-srow__meta"></div>' +
                  szFold +
                '</div>' +
              '</div>' +
              /* Общее поле блюда: значение — сразу всем размерам (Enter/«Сохранить»);
                 когда по размерам значения разные — поле пустое с подсказкой «разные» */
              (rowOff
                ? (it.offOutline
                    ? slFieldHtml(i, null, slLiveRestOf(it, null), it.unit || 'шт', true, !!RT.cfg.noSteps, !!RT.cfg.noClear, '', ' data-sl-group="' + i + '"')
                    : '')
                : slGroupFieldHtml(it, i)) +
              (RT.cfg.rowAdd ? '</div>' : '') +
              (RT.cfg.rowAdd && !rowOff
                ? '<button class="kds-btn-warn-out kds-srow__add" type="button" data-sl-rowadd="' + i + '" aria-label="В стоп-лист" title="В стоп-лист"><span class="material-icons">add</span></button>'
                : (RT.cfg.rowAdd
                    ? '<button class="kds-btn-warn-out kds-srow__add' + (rowOff && it.offOutline ? '' : ' is-ph') + '" type="button" disabled aria-hidden="' + (rowOff && it.offOutline ? 'false' : 'true') + '" tabindex="-1"><span class="material-icons">add</span></button>'
                    : '')) +
            '</div></div>' +
            slAddSizesHtml(it, i);
        }
        /* Проба: у одной позиции (cfg.mergeDish + cfg.mergeRow) блюдо и остаток — ОДИН блок,
           поле переезжает внутрь коробки названия; остальные строки остаются как были */
        var merged = !!(RT.cfg.mergeDish && i === (RT.cfg.mergeRow || 0));
        var fieldHtml = slFieldHtml(i, null, it.rest != null ? String(it.rest) : '', it.unit || 'шт', !!it._fail, !!RT.cfg.noSteps, !!RT.cfg.rowAdd);
        /* Уже в стоп-листе — строка остаётся недоступной */
        var offPlain = slLiveInStop(it, null);
        /* «Мясная»: поле и кнопка остаются видимыми, но в состоянии Disable */
        var plainField = (offPlain && it.offOutline)
          ? slFieldHtml(i, null, slLiveRestOf(it, null), it.unit || 'шт', true, !!RT.cfg.noSteps, !!RT.cfg.noClear)
          : fieldHtml;
        var mChkPlain = (offPlain && RT.cfg.multi)
          ? '<button class="kds-srow__check is-off" type="button" data-sl-check="' + i + '" disabled aria-disabled="true"><span class="material-icons">check_box_outline_blank</span></button>'
          : mChk;
        /* Уже внесённое блюдо — чекбокс остаётся в разметке (ширина не меняется), но невидим */
        return '<div class="kds-srow' + (RT.sl.checks[i] ? ' is-sel' : '') + (offPlain ? ' is-off-row' : '') + '" data-sl-row="' + i + '" data-sl-name="' + esc(it.name) + '">' +
          '<div class="kds-srow__top' + (merged ? ' kds-srow__top--merged' : '') + '">' +
            (RT.cfg.rowAdd ? '<div class="kds-srow__plate">' : '') +
            '<div class="kds-srow__box">' + mChkPlain +
              '<div class="kds-srow__main' + ((it._fail || offPlain) ? ' is-off' : '') + (RT.cfg.multi ? '' : ' is-static') + '"' + (it._fail ? ' data-sl-fail' : '') + '>' +
                '<div class="kds-srow__namecol">' +
                  '<span class="kds-srow__name">' + esc(it.name) + '</span>' +

                /* Служебная подпись — только когда она что-то объясняет:

                  ? '<div class="kds-srow__meta"><span class="kds-srow__meta-t kds-srow__meta-t--danger">Исключена из меню</span></div>'

              '</div>' +
              (merged ? fieldHtml : '') +
            '</div>' +
            (merged || (offPlain && !it.offOutline) ? '' : plainField) +
            (RT.cfg.rowAdd ? '</div>' : '') +
            (RT.cfg.rowAdd && !offPlain
              ? '<button class="kds-btn-warn-out kds-srow__add" type="button" data-sl-rowadd="' + i + '"' + (it._fail ? ' disabled' : '') + ' aria-label="В стоп-лист" title="В стоп-лист"><span class="material-icons">add</span></button>'
              : (RT.cfg.rowAdd
                  ? '<button class="kds-btn-warn-out kds-srow__add' + (offPlain && it.offOutline ? '' : ' is-ph') + '" type="button" disabled aria-hidden="' + (offPlain && it.offOutline ? 'false' : 'true') + '" tabindex="-1"><span class="material-icons">add</span></button>'
                  : '')) +
          '</div></div>';
      }
      /* Если все размеры позиции в стопе — сама позиция тоже считается в стопе */
      var stopNow = slIsStopped(it);
      /* Для строки блюда «Полный стоп» показываем и при неполном размерном ряде

      var stopLine = (stopNow && !(RT.cfg && RT.cfg.split)) ? slStopLine(it.name) : '';

      if (sized) metaSegs.push({ t: 'Все размеры' });
      /* «В заказах: N» — только там, где это уместно (на экране с панелями раскрытия убрано) */
      if (work && !(RT.cfg && RT.cfg.noWork)) metaSegs.push({ t: 'В заказах: ' + work });

      /* Состояние позиции — в тот же слот справа, где стоит служебная подпись.

      var exclCap = !!(RT.cfg && RT.cfg.split && it.excluded);

      if (sized && RT.cfg.flatSizes && !slSizesUniform(it)) return slSizesFlatHtml(it, i);
      /* Одна строка блюда — без шеврона и без вложенных строк размеров:

      var main = '<div class="kds-srow__main">' +
        '<div class="kds-srow__namecol">' +
          '<div class="kds-srow__l1"><span class="kds-srow__name">' + esc(it.name) + '</span>' +
            (sstopT ? '<span class="kds-sstop">' + slSstopInner(sstopT, it.name) + '</span>' : '') + '</div>' +
          /* Причина «Исключена из меню» — подписью под названием (Caption L), не справа */
          (exclCap ? '<span class="kds-srow__cap is-stop">Исключена из меню</span>' : '') +
        '</div>' +
        '<div class="kds-srow__meta">' + metaHtml + '</div>' +
      '</div>';
      var chk = '<button class="kds-srow__check' + (RT.sl.checks[i] ? ' is-on' : '') + '" type="button" data-sl-check="' + i + '"' + (it.excluded ? ' disabled' : '') + '><span class="material-icons">' + (RT.sl.checks[i] ? 'check_box' : 'check_box_outline_blank') + '</span></button>';
      /* Input number — ЗА коробкой блюда, справа. У блюда с размерами — ОБЩЕЕ поле:

      var field = sized

          (RT.cfg.rowStop
            ? '<span class="kds-srow__acts">' +

                  '<span class="material-icons">delete</span></button>' +
                '<button class="kds-btn-neg-out kds-srow__stop" type="button" data-sl-rowstop="' + i + '" aria-label="В стоп" title="В стоп"' + ((allStop || it.excluded) ? ' disabled' : '') + '>' +
                  '<span class="material-icons">block</span></button>' +
              '</span>'
            : '') +
        '</div></div>';
    }
    /* Размеры позиции на экранах внесения — строки под заголовком блюда (Figma 10628:57825):
       у каждого размера своё поле остатка, чекбокс (массовое внесение) и своя кнопка «В стоп-лист» */
    function slAddSizesHtml(it, i) {
      var foldOff = !!RT.sl.folds[i] && !it.offOutline;   /* «Мясная»: размеры остаются видны */
      return it.sizes.map(function (sz, si) {
        var szKey = i + ':' + si;
        var szOff = slLiveInStop(it, si);      /* размер уже в стоп-листе — строка недоступна */
        var chk = RT.cfg.multi
          ? '<button class="kds-srow__check' + (szOff ? ' is-off' : (RT.sl.checks[szKey] ? ' is-on' : '')) + '" type="button" data-sl-check="' + szKey + '"' + (szOff ? ' disabled aria-disabled="true"' : '') + '><span class="material-icons">' + (szOff ? 'check_box_outline_blank' : (RT.sl.checks[szKey] ? 'check_box' : 'check_box_outline_blank')) + '</span></button>'
          : '';
        return '<div class="kds-srow kds-srow--sub' + (RT.sl.checks[szKey] ? ' is-sel' : '') + (szOff ? ' is-off-row' : '') + (szOff && it.offOutline ? ' is-off-outline' : '') + '" data-sl-row="' + i + '" data-sl-si="' + si + '" data-sl-key="' + szKey + '" data-sl-name="' + esc(it.name + ' ' + sz.s) + '"' +
          (foldOff ? ' style="display:none"' : '') + '>' +
          '<div class="kds-srow__top">' +
            (RT.cfg.rowAdd ? '<div class="kds-srow__plate">' : '') +
            '<div class="kds-srow__box">' + chk +
              '<div class="kds-srow__main' + (RT.cfg.multi ? '' : ' is-static') + (szOff ? ' is-off' : '') + '">' +
                '<div class="kds-srow__namecol">' +
                  '<div class="kds-srow__l1"><span class="kds-srow__name">' + esc(sz.s) + '</span></div>' +
                '</div>' +
                '<div class="kds-srow__meta"></div>' +
              '</div>' +
            '</div>' +
            (szOff && !it.offOutline ? '' : (szOff ? slFieldHtml(i, si, slLiveRestOf(it, si), it.unit || 'шт', true, !!RT.cfg.noSteps, !!RT.cfg.noClear) : slFieldHtml(i, si, sz.rest != null ? String(sz.rest) : '', it.unit || 'шт', false, !!RT.cfg.noSteps, !!RT.cfg.rowAdd))) +
            (RT.cfg.rowAdd ? '</div>' : '') +
            (RT.cfg.rowAdd && !szOff
              ? '<button class="kds-btn-warn-out kds-srow__add" type="button" data-sl-rowadd="' + szKey + '" aria-label="В стоп-лист" title="В стоп-лист"><span class="material-icons">add</span></button>'
              : (RT.cfg.rowAdd
                  ? '<button class="kds-btn-warn-out kds-srow__add' + (szOff && it.offOutline ? '' : ' is-ph') + '" type="button" disabled aria-hidden="' + (szOff && it.offOutline ? 'false' : 'true') + '" tabindex="-1"><span class="material-icons">add</span></button>'

          '</div></div>';

    }
    /* Размеры позиции — отдельные строки с отступом (Figma 10628:57825): название 22/28,
       остаток — своё поле в строке, справа */
    function slSizesHtml(it, i, foldOn) {
      return it.sizes.map(function (sz, si) {
        var empty = !sz.stop && (sz.rest == null || sz.rest === '');
        /* Полный стоп — в поле цифра 0, а не плейсхолдер */
        var val = sz.stop ? '0' : (sz.rest != null ? String(sz.rest) : '');
        /* У размера в стопе — тоже кто и когда поставил */
        var stopLine = sz.stop ? slStopLine(it.name + ' ' + sz.s) : '';
        /* У размера — свой ключ отметки (index:размер): размер выбирается отдельно от блюда */
        var szKey = i + ':' + si;
        var szChk = '<button class="kds-srow__check' + (RT.sl.checks[szKey] ? ' is-on' : '') + '" type="button" data-sl-check="' + szKey + '"' + (it.excluded ? ' disabled' : '') + '><span class="material-icons">' + (RT.sl.checks[szKey] ? 'check_box' : 'check_box_outline_blank') + '</span></button>';
        return '<div class="kds-srow kds-srow--sub' + (RT.sl.checks[szKey] ? ' is-sel' : '') + (sz.stop ? ' is-stop' : '') + '" data-sl-row="' + i + '" data-sl-si="' + si + '" data-sl-key="' + szKey + '" data-sl-name="' + esc(it.name + ' ' + sz.s) + '"' +
          (foldOn ? ' style="display:none"' : '') + '>' +
          '<div class="kds-srow__top">' + (RT.cfg.rowStop ? '<div class="kds-srow__plate">' : '') +

    function slPaneRowsHtml() {

      items.forEach(function (it, i) {
        var hay = (it.name + ' ' + (it.sizes || []).map(function (s) { return s.s; }).join(' ')).toLowerCase();
        if (q && hay.indexOf(q) === -1) return;
        visible.push({ it: it, i: i });
